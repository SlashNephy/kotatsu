{{- /*
マイグレーションは、install と upgrade の前に Job で kotatsu migrate を実行して適用する (設計書 11.4)。
ローリング更新の間は新旧のバイナリが同時に動くので、マイグレーションは段階を踏んで互換性を保つ。
*/}}
{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-migrate" (include "kotatsu.fullname" .) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kotatsu.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "kotatsu.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "kotatsu.image" (dict "root" $ "ffmpeg" false) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - migrate
          env:
            - name: KOTATSU_DATABASE_URL
              {{- include "kotatsu.secretRef" .Values.secrets.databaseURL | nindent 14 }}
            {{- with include "kotatsu.configEnv" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
{{- end }}
