# Kotatsu の Helm Chart の設定 (設計書 11.1)。
# PostgreSQL は Chart に含めないので、外部のもの (CloudNativePG など) を用意して、接続先を Secret で渡す。

# mode は、全ロールを 1 つの Pod で動かす all か、ロールごとに Pod を分ける split のどちらか。
mode: all

image:
  repository: ghcr.io/slashnephy/kotatsu
  # tag が空なら、Chart の appVersion を使う。
  tag: ""
  # digest は、FFmpeg を含まないイメージの digest (sha256:...)。指定すると、タグに加えて digest で固定する。
  digest: ""
  # ffmpegDigest は、-ffmpeg のイメージの digest。digest とは別のイメージなので、別に指定する。
  ffmpegDigest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# secrets は、Kotatsu に渡す秘密情報を持つ Secret とキー。Chart は Secret を作らないので、先に作っておく。
# 項目ごとに Secret を分けられる。たとえば、接続先は CloudNativePG が作る Secret から、秘密キーは別の Secret から渡せる。
secrets:
  # databaseURL は、PostgreSQL の接続先 (postgres://...)。
  databaseURL:
    name: kotatsu
    key: database-url
  # secretKey は、アプリの秘密キー (32 バイト以上)。なくすと、TOTP と Web Push の設定し直しと、Webhook の作り直しが必要になる。
  secretKey:
    name: kotatsu
    key: secret-key
  # tunerURL は、チューナーサーバーの URL。BASIC 認証の資格情報を URL に含めるときは、こちらで渡す。
  # name が空なら渡さない。config.TUNER_URL と両方には書けない。
  tunerURL:
    name: ""
    key: tuner-url
  # oidcClientSecret は、OIDC のクライアントシークレット。name が空なら渡さない。
  # config.AUTH_OIDC_CLIENT_SECRET と両方には書けない。
  oidcClientSecret:
    name: ""
    key: oidc-client-secret

# priorityClassName は、すべての Pod に付ける PriorityClass。all や roles の各ロールで priorityClassName を指定すると、そちらを使う。
priorityClassName: ""

# extraEnv と extraEnvFrom は、すべてのコンテナに足す環境変数 (Kubernetes の env と envFrom の形)。
# secrets にない秘密の設定を、Secret から渡すのに使う。
# 例:
#   extraEnv:
#     - name: KOTATSU_WEBPUSH_SUBJECT
#       valueFrom:
#         secretKeyRef:
#           name: kotatsu
#           key: webpush-subject
extraEnv: []
extraEnvFrom: []

# config は、環境変数で渡す Kotatsu の設定 (KOTATSU_ の後ろの名前と値)。
# 例: {TUNER_URL: http://mirakurun:40772/, SERVER_ALLOWED_NETWORKS: "10.0.0.0/8,192.168.0.0/16"}
config: {}

# storage.pools は、録画の保存先プール。どのプールも、録画を書く mikan、読む tenban と kyusu、解析する nekonote にマウントする。
# volume は、Pod の volume の定義 (persistentVolumeClaim や nfs など)。
# 例:
#   - id: main
#     volume:
#       persistentVolumeClaim:
#         claimName: kotatsu-recordings
# storage.sidecar は、新しい録画の付属ファイル (索引、代表画像、プレビュー画像) をまとめて置く volume (設計書 5.6)。
# 省けば、録画ファイルの横 (番組名.m2ts.kotatsu/) に置く。すでにある付属ファイルは移さない。プールと同じロールにマウントする。
# 例:
#   volume:
#     persistentVolumeClaim:
#       claimName: kotatsu-sidecars
storage:
  pools: []
  sidecar: {}

# podSecurityContext と securityContext は、すべての Pod とコンテナに付ける。既定値は堅くしてあり、そのまま使える。
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: kotatsu.example.com
  tls: []
  # trustedProxies は、X-Forwarded-For を信頼する Ingress のコントローラーのネットワーク (CIDR か IP アドレス)。
  # KOTATSU_SERVER_TRUSTED_PROXIES として渡す。Ingress を使うなら必須で、空だと Ingress を通る全リクエストが 400 になる。
  # 普通は、コントローラーの Pod が使う Pod のネットワークの CIDR を書く。例: ["10.244.0.0/16"]
  # コントローラーの前で送信元のアドレスが書き換わる (SNAT) と、送信元がノードのアドレスに見え、接続元の制限が効かない。
  # コントローラーの Service を externalTrafficPolicy: Local にするなどして、送信元を保つ。
  trustedProxies: []

# migration は、install と upgrade の前に kotatsu migrate を実行する Job (設計書 11.4)。
migration:
  enabled: true
  resources: {}

# all は、mode が all のときの Pod の設定。FFmpeg が要るので、-ffmpeg のイメージを使う。
all:
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # runtimeClassName は、Pod を動かすランタイム。GPU を使うとき、NVIDIA のランタイムが既定でないクラスター (k3s など) では、
  # その RuntimeClass の名前 (例: nvidia) を入れる。空なら既定のランタイムを使う。
  runtimeClassName: ""
  # terminationGracePeriodSeconds は、mikan が録画を引き継ぐまで待つ時間を含める。
  terminationGracePeriodSeconds: 300
  # workSizeLimit は、kyusu が HLS のセグメントを置く作業ディレクトリ (emptyDir) の容量の上限。空なら上限を付けない。
  # 超えると kubelet が Pod を退避させるので、同時に開くセッションの数と画質に見合う量にする。
  workSizeLimit: ""

# roles は、mode が split のときの、ロールごとの Pod の設定。
# ffmpeg が true のロールは、-ffmpeg のイメージを使う。pools が true のロールには、録画の保存先プールをマウントする。
roles:
  tenban:
    replicas: 2
    ffmpeg: false
    pools: true
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    runtimeClassName: ""
    terminationGracePeriodSeconds: 30
  neko:
    # neko は、リースを持つ 1 つだけが動くので、増やしても待機になる。
    replicas: 1
    ffmpeg: false
    pools: false
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    runtimeClassName: ""
    terminationGracePeriodSeconds: 30
  mikan:
    # mikan を 2 つ以上にすると、更新の間も録画が途切れない (設計書 5.4)。
    replicas: 2
    ffmpeg: false
    pools: true
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    runtimeClassName: ""
    # 終了のシグナルを受けてから、別の mikan が録画を引き継ぐまで待つ。
    terminationGracePeriodSeconds: 300
    podDisruptionBudget:
      maxUnavailable: 1
  nekonote:
    replicas: 1
    ffmpeg: true
    pools: true
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    runtimeClassName: ""
    terminationGracePeriodSeconds: 60
  kyusu:
    # kyusu はサーバー側でのトランスコードで、なくても動く。GPU のあるノードに置くときは nodeSelector と resources を使い、
    # NVIDIA のランタイムが既定でないクラスターでは runtimeClassName も入れる (all の runtimeClassName を参照)。
    replicas: 0
    # workSizeLimit は、HLS のセグメントを置く作業ディレクトリ (emptyDir) の容量の上限。空なら上限を付けない。
    # 超えると kubelet が Pod を退避させるので、同時に開くセッションの数と画質に見合う量にする。
    workSizeLimit: ""
    ffmpeg: true
    pools: true
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    runtimeClassName: ""
    terminationGracePeriodSeconds: 30
