# 開発用の Compose (compose.yaml) で動かす Dex の設定。OIDC でログインし、ユーザーを自動で作る (docs/development.md)。
# 開発専用で、パスワードも固定の値を使うので、運用には使わない。
#
# Dex のイメージは、起動の前に gomplate でこのファイルを展開するので、getenv で環境変数を読める。

# ブラウザと Kotatsu のコンテナの両方から、同じ URL で届くようにする。
# ブラウザは *.localhost をループバックに解決し、コンテナは Compose のネットワークの別名 (dex.localhost) で引く。
issuer: http://dex.localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  # 毎回の同意の画面を省く。
  skipApprovalScreen: true

staticClients:
  - id: kotatsu
    name: Kotatsu
    secret: kotatsu-development-only-client-secret
    # Kotatsu は、接続したオリジンに /auth/oidc/callback を付けて IdP に戻させる。
    # Kotatsu を直接開くときと、mise run //frontend:dev の Vite の開発サーバー (5173) から開くときの両方を許す。
    redirectURIs:
      {{- $port := getenv "KOTATSU_DEV_PORT" "8080" }}
      - http://localhost:{{ $port }}/auth/oidc/callback
      - http://127.0.0.1:{{ $port }}/auth/oidc/callback
      - http://localhost:5173/auth/oidc/callback
      - http://127.0.0.1:5173/auth/oidc/callback

enablePasswordDB: true

# ロールごとのユーザー。パスワードはどれも password (bcrypt のハッシュ)。
# groups は、Kotatsu の auth.oidc.auto_create の *_groups に合わせる。
staticPasswords:
  - email: admin@example.com
    hash: "$2y$10$DgYa2pvXltnBEdnJuZZhN.1S8h8YIAoHD6uclWuQSQVAxpVV6G2XO"
    username: admin
    preferredUsername: admin
    userID: 6f8d3c1e-2a4b-4c5d-9e7f-0a1b2c3d4e01
    groups: [admins]
  - email: member@example.com
    hash: "$2y$10$DgYa2pvXltnBEdnJuZZhN.1S8h8YIAoHD6uclWuQSQVAxpVV6G2XO"
    username: member
    preferredUsername: member
    userID: 6f8d3c1e-2a4b-4c5d-9e7f-0a1b2c3d4e02
    groups: [members]
  - email: viewer@example.com
    hash: "$2y$10$DgYa2pvXltnBEdnJuZZhN.1S8h8YIAoHD6uclWuQSQVAxpVV6G2XO"
    username: viewer
    preferredUsername: viewer
    userID: 6f8d3c1e-2a4b-4c5d-9e7f-0a1b2c3d4e03
    groups: [viewers]
