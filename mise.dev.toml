# 開発用の Compose (compose.yaml) のコンテナで使うツールとタスク (docs/development.md)。
# コンテナは MISE_ENV=dev で動かすので、mise.toml に加えて、これも読む。
[tools]
# ソースの変更を見て、ビルドし直す。
watchexec = "2.7.3"

# Go のソースを変えたら、ビルドし直し、マイグレーションを当ててから、全ロールを起動し直す。
# go run は、ビルドするたびにキャッシュとテンポラリを膨らませるので、go build で作ったものを実行する。
# exec で置き換え、watchexec の止める合図が Kotatsu に届くようにする。
# go generate などで一度にたくさん書き換えたときに、何度もビルドしないよう、2 秒待ってからまとめてビルドする。
[tasks."dev:server"]
run = "watchexec --shell=none --exts go --watch cmd --watch internal --watch graph --watch web/embed.go --restart --debounce 2s --stop-timeout 30s -- sh -c 'go build -o $HOME/bin/kotatsu ./cmd/kotatsu && $HOME/bin/kotatsu migrate && exec $HOME/bin/kotatsu all'"

# 画面の開発サーバー。ブラウザは、ここを入口にして、API と映像を Kotatsu に中継させる。
[tasks."dev:web"]
dir = "web"
run = "pnpm exec vp dev --host 0.0.0.0 --port 8080 --strictPort"
