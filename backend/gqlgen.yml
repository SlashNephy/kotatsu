# GraphQL のスキーマから、実行のコードとモデルを生成する (設計書 2.1、9.1)。mise run //backend:generate で生成する。
schema:
  - internal/web/graph/schema/*.graphqls

exec:
  package: generated
  layout: single-file
  filename: internal/web/graph/generated/generated.go

model:
  filename: internal/web/graph/model/models_gen.go
  package: model

resolver:
  package: graph
  layout: follow-schema
  dir: internal/web/graph
  filename_template: "{name}.resolvers.go"

# リゾルバのファイルに「Code generated」の注記を付けない。付けると、整形 (golangci-lint fmt) の対象から外れるからである。
omit_gqlgen_file_notice: true
omit_getters: true
# Go の名前で略語を大文字のままにする語。既定の語 (ID、URL など) に足す。
go_initialisms:
  initialisms:
    - CM
struct_fields_always_pointers: true
resolvers_always_return_pointers: true

models:
  AssignmentState:
    model: github.com/SlashNephy/kotatsu/internal/domain.AssignmentState
    enum_values:
      PENDING:
        value: github.com/SlashNephy/kotatsu/internal/domain.AssignmentStatePending
      OK:
        value: github.com/SlashNephy/kotatsu/internal/domain.AssignmentStateOK
      PARTIAL:
        value: github.com/SlashNephy/kotatsu/internal/domain.AssignmentStatePartial
      CONFLICT:
        value: github.com/SlashNephy/kotatsu/internal/domain.AssignmentStateConflict
  ReservationDisabledReason:
    model: github.com/SlashNephy/kotatsu/internal/domain.ReservationDisabledReason
    enum_values:
      RECORDED_EPISODE:
        value: github.com/SlashNephy/kotatsu/internal/domain.ReservationDisabledReasonRecordedEpisode
  NotificationKind:
    model: github.com/SlashNephy/kotatsu/internal/domain.NotificationKind
    enum_values:
      RECORDING_STARTED:
        value: github.com/SlashNephy/kotatsu/internal/domain.NotificationKindRecordingStarted
      RECORDING_COMPLETED:
        value: github.com/SlashNephy/kotatsu/internal/domain.NotificationKindRecordingCompleted
      RECORDING_FAILED:
        value: github.com/SlashNephy/kotatsu/internal/domain.NotificationKindRecordingFailed
      RESERVATION_CONFLICT:
        value: github.com/SlashNephy/kotatsu/internal/domain.NotificationKindReservationConflict
      STORAGE_LOW:
        value: github.com/SlashNephy/kotatsu/internal/domain.NotificationKindStorageLow
      TUNER_SERVER_UNREACHABLE:
        value: github.com/SlashNephy/kotatsu/internal/domain.NotificationKindTunerServerUnreachable
      WATCH_REMINDER:
        value: github.com/SlashNephy/kotatsu/internal/domain.NotificationKindWatchReminder
      ANIME_RECORDED:
        value: github.com/SlashNephy/kotatsu/internal/domain.NotificationKindAnimeRecorded
      ANIME_RECORD_FAILED:
        value: github.com/SlashNephy/kotatsu/internal/domain.NotificationKindAnimeRecordFailed
      SCRAMBLED_RECORDINGS:
        value: github.com/SlashNephy/kotatsu/internal/domain.NotificationKindScrambledRecordings
  ReservationKind:
    model: github.com/SlashNephy/kotatsu/internal/domain.ReservationKind
    enum_values:
      PROGRAM:
        value: github.com/SlashNephy/kotatsu/internal/domain.ReservationKindProgram
      TIME:
        value: github.com/SlashNephy/kotatsu/internal/domain.ReservationKindTime
      RULE:
        value: github.com/SlashNephy/kotatsu/internal/domain.ReservationKindRule
  GoModuleLicense:
    model:
      - github.com/SlashNephy/kotatsu/internal/web/licenses.Module
  LicenseFile:
    model:
      - github.com/SlashNephy/kotatsu/internal/web/licenses.File
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  Time:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  Int64:
    model:
      - github.com/99designs/gqlgen/graphql.Int64
  User:
    fields:
      # アイコンは、要るときにだけ引く (#778)。
      avatarUrl:
        resolver: true
  Service:
    model: github.com/SlashNephy/kotatsu/internal/web/graph/model.Service
    fields:
      channelType:
        resolver: true
      jikkyo:
        resolver: true
      videoFormat:
        resolver: true
      timeshiftPrograms:
        resolver: true
      timeshiftBuffer:
        resolver: true
  TimeshiftProgram:
    model: github.com/SlashNephy/kotatsu/internal/web/graph/model.TimeshiftProgram
    fields:
      service:
        resolver: true
  TimeshiftBuffer:
    model: github.com/SlashNephy/kotatsu/internal/web/graph/model.TimeshiftBuffer
  TimeshiftChannel:
    model: github.com/SlashNephy/kotatsu/internal/web/graph/model.TimeshiftChannel
    fields:
      service:
        resolver: true
  Program:
    model: github.com/SlashNephy/kotatsu/internal/web/graph/model.Program
    fields:
      service:
        resolver: true
      sharedFrom:
        resolver: true
      reservation:
        resolver: true
      watchReserved:
        resolver: true
      animeEpisodes:
        resolver: true
  GuideRow:
    model: github.com/SlashNephy/kotatsu/internal/web/graph/model.GuideRow
  GuideView:
    model: github.com/SlashNephy/kotatsu/internal/web/graph/model.GuideView
    fields:
      services:
        resolver: true
  ProgramConditions:
    model: github.com/SlashNephy/kotatsu/internal/web/graph/model.ProgramConditions
    fields:
      services:
        resolver: true
  Rule:
    model: github.com/SlashNephy/kotatsu/internal/web/graph/model.Rule
  Recording:
    model: github.com/SlashNephy/kotatsu/internal/web/graph/model.Recording
    fields:
      service:
        resolver: true
      videoFormat:
        resolver: true
      watchFrame:
        resolver: true
      rule:
        resolver: true
      liveStats:
        resolver: true
      animeEpisodes:
        resolver: true
      cmSections:
        resolver: true
      cmDetection:
        resolver: true
      failureDetail:
        resolver: true
  ReservationAssignment:
    model: github.com/SlashNephy/kotatsu/internal/web/graph/model.ReservationAssignment
    fields:
      peers:
        resolver: true
  Reservation:
    model: github.com/SlashNephy/kotatsu/internal/web/graph/model.Reservation
    fields:
      service:
        resolver: true
      rules:
        resolver: true
