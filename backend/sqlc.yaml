version: "2"
sql:
  - engine: postgresql
    schema: db/schema.sql
    queries: db/queries
    gen:
      go:
        package: sqlc
        out: internal/infra/database/sqlc
        sql_package: pgx/v5
        # 将来 SQLite のクエリを足すときの差し替え口にする (設計書 2.1)。
        emit_interface: true
        emit_empty_slices: true
        rename:
          api_id: APIID
          source_ip: SourceIP
          url: URL
          image_url: ImageURL
          image_urls: ImageURLs
          vapid_key: VAPIDKey
          p256dh: P256DH
          pid_stats: PIDStats
          mcp_enabled: MCPEnabled
          data_broadcast_ip_enabled: DataBroadcastIPEnabled
          external_player_urls_enabled: ExternalPlayerURLsEnabled
          iptv_feeds_enabled: IPTVFeedsEnabled
          epgstation_api_enabled: EPGStationAPIEnabled
        overrides:
          - column: reservations.kind
            go_type:
              import: github.com/SlashNephy/kotatsu/internal/domain
              type: ReservationKind
          - column: reservations.assignment_state
            go_type:
              import: github.com/SlashNephy/kotatsu/internal/domain
              type: AssignmentState
          - column: reservations.disabled_reason
            go_type:
              import: github.com/SlashNephy/kotatsu/internal/domain
              type: ReservationDisabledReason
              pointer: true
          - column: notification_events.kind
            go_type:
              import: github.com/SlashNephy/kotatsu/internal/domain
              type: NotificationKind
          - column: notification_preferences.kind
            go_type:
              import: github.com/SlashNephy/kotatsu/internal/domain
              type: NotificationKind
          - column: users.role
            go_type:
              import: github.com/SlashNephy/kotatsu/internal/domain
              type: Role
          - column: webhooks.format
            go_type:
              import: github.com/SlashNephy/kotatsu/internal/domain
              type: WebhookFormat
          - column: recordings.state
            go_type:
              import: github.com/SlashNephy/kotatsu/internal/domain
              type: RecordingState
          - column: recordings.failure_reason
            go_type:
              import: github.com/SlashNephy/kotatsu/internal/domain
              type: RecordingFailureReason
              pointer: true
          - column: recording_failure_counts.reason
            go_type:
              import: github.com/SlashNephy/kotatsu/internal/domain
              type: RecordingFailureReason
          - column: recording_assignments.state
            go_type:
              import: github.com/SlashNephy/kotatsu/internal/domain
              type: RecordingAssignmentState
          - column: timeshift_assignments.state
            go_type:
              import: github.com/SlashNephy/kotatsu/internal/domain
              type: RecordingAssignmentState
          - column: audit_events.actor_type
            go_type:
              import: github.com/SlashNephy/kotatsu/internal/domain
              type: AuditActorType
          - column: network_activity.purpose
            go_type:
              import: github.com/SlashNephy/kotatsu/internal/lib/netactivity
              type: Purpose
          - column: network_activity.initiator
            go_type:
              import: github.com/SlashNephy/kotatsu/internal/lib/netactivity
              type: Initiator
          - column: webhooks.kinds
            go_type:
              import: github.com/SlashNephy/kotatsu/internal/domain
              type: NotificationKind
              slice: true
          - db_type: uuid
            go_type:
              type: UUID
              import: uuid
          - db_type: uuid
            go_type:
              type: UUID
              import: uuid
              pointer: true
            nullable: true
          - db_type: text
            go_type:
              type: string
              pointer: true
            nullable: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            go_type:
              type: Time
              import: time
              pointer: true
            nullable: true
          - db_type: pg_catalog.int8
            go_type:
              type: int64
              pointer: true
            nullable: true
          - db_type: pg_catalog.int4
            go_type:
              type: int32
              pointer: true
            nullable: true
          - db_type: pg_catalog.float8
            go_type:
              type: float64
              pointer: true
            nullable: true
          - db_type: inet
            go_type:
              type: Addr
              import: net/netip
          - db_type: inet
            go_type:
              type: Addr
              import: net/netip
              pointer: true
            nullable: true
