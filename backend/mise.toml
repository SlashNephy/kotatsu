[tools]
golangci-lint = "2.15.0" # go より先に置かないと、go/bin/ のバイナリが優先されてしまう
# ルートと同じバージョン。golangci-lint より後に置くため、ここでも書く。
go = "1.27.4"
atlas-community = "1.4.0"
sqlc = "1.31.1"

[tasks.test]
# DB を使うテストは、パッケージをまたいで並行に動くと PostgreSQL の接続数の上限 (既定は 100) に達する。
# CPU の多いマシンでも CI (4 コア) と同じ並行度になるよう、同時に動かすパッケージの数を絞る。
run = "go test -race -p 4 ./..."

# 開発用の Compose の postgres-test を起動し、DB を使うテストも含めて流す (docs/development.md)。
# 開発用のスタックの postgres には向けない。接続の上限を使い切ると、スタックの接続まで断られるためである。
# CI は、ジョブごとに立てた PostgreSQL に向けて test を流すので、これは使わない。
[tasks."test:db"]
env = { KOTATSU_TEST_DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:55433/postgres?sslmode=disable" }
run = ["docker compose -f ../compose.yaml up -d --wait postgres-test", "go test -race -p 4 ./..."]

[tasks.lint]
run = "golangci-lint run"

[tasks.fmt]
run = "golangci-lint fmt"

# db/schema.sql とマイグレーションの差分から、新しいマイグレーションを生成する (Docker が要る)。
# 名前を付けるときは mise run //backend:db:diff -- add_users のように渡す。
[tasks."db:diff"]
run = "atlas migrate diff --env local"

[tasks.generate]
depends = ["//frontend:zxcvbn"]
run = [
  "sqlc generate",
  # GraphQL のスキーマから、実行のコードとモデルを生成する。リゾルバの実装は残る。
  "go tool gqlgen generate",
  # ENUM(...) のコメントを書いた型から、値の一覧と Parse を生成する (go:generate)。
  "go generate ./...",
  # gqlgen が書き換えたリゾルバの import を、リポジトリの形式にそろえる。
  "golangci-lint fmt",
  # フロントエンドの Relay のコンパイラが読む、1 つにまとめたスキーマを出力する。
  "go run ./internal/web/graph/printschema > ../frontend/schema.graphql",
  # 囲み文字のテーブル (internal/domain/enclosed.go) を、画面で使う TypeScript に出力する。
  "go run ./internal/domain/printenclosed > ../frontend/src/futon/enclosedCharacters.gen.ts",
  # MCP サーバーが SPA なしで返すアイコンを、画面の原本からコピーする。
  "cp ../frontend/public/icons/icon.svg ../frontend/public/icons/icon-192.png internal/web/webui/icons/",
  # schema.sql とマイグレーションが食い違っていれば、ここで新しいマイグレーションが生成される。
  "atlas migrate diff --env local",
  "atlas migrate validate --env local",
]
