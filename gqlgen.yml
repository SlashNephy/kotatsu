# GraphQL のスキーマから、実行のコードとモデルを生成する (設計書 2.1、9.1)。mise run generate で生成する。
schema:
  - graph/schema/*.graphqls

exec:
  package: generated
  layout: single-file
  filename: graph/generated/generated.go

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  package: graph
  layout: follow-schema
  dir: graph
  filename_template: "{name}.resolvers.go"

# リゾルバのファイルに「Code generated」の注記を付けない。付けると、整形 (golangci-lint fmt) の対象から外れるからである。
omit_gqlgen_file_notice: true
omit_getters: true
struct_fields_always_pointers: true
resolvers_always_return_pointers: true

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  Time:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  Int64:
    model:
      - github.com/99designs/gqlgen/graphql.Int64
  Service:
    model: github.com/SlashNephy/kotatsu/graph/model.Service
    fields:
      channelType:
        resolver: true
      jikkyo:
        resolver: true
  Program:
    model: github.com/SlashNephy/kotatsu/graph/model.Program
    fields:
      service:
        resolver: true
      sharedFrom:
        resolver: true
      reservation:
        resolver: true
      watchReserved:
        resolver: true
  GuideRow:
    model: github.com/SlashNephy/kotatsu/graph/model.GuideRow
  GuideView:
    model: github.com/SlashNephy/kotatsu/graph/model.GuideView
    fields:
      services:
        resolver: true
  ProgramConditions:
    model: github.com/SlashNephy/kotatsu/graph/model.ProgramConditions
    fields:
      services:
        resolver: true
  Rule:
    model: github.com/SlashNephy/kotatsu/graph/model.Rule
  Recording:
    model: github.com/SlashNephy/kotatsu/graph/model.Recording
    fields:
      service:
        resolver: true
      watchFrame:
        resolver: true
  Reservation:
    model: github.com/SlashNephy/kotatsu/graph/model.Reservation
    fields:
      service:
        resolver: true
      rules:
        resolver: true
