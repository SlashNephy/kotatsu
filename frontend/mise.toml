# ツールは、ルートの mise.toml の node と pnpm を引き継ぐ。
# ビルドした SPA は ../backend/internal/web/webui/dist/app に出力され、go build で埋め込まれる。
# 埋め込んだバイナリを作るときは、mise run //frontend:build の後に mise run build を実行する。

[tasks.install]
run = [
  "pnpm install --frozen-lockfile",
  # 字幕を描くフォントは npm にないので、vendor/caption-font/SOURCE で固定したリリースから取得する。
  "node scripts/fetch-caption-font.mjs",
]

# ブラウザ内での変換に使う mpeg2toh264 のプレイヤーを、vendor/mpeg2toh264/SOURCE の commit からビルドし直す (設計書 7.2)。
# Rust と wasm-bindgen は mise.mpeg2toh264.toml で固定しているので、MISE_ENV=mpeg2toh264 を付けて実行する。
[tasks.mpeg2toh264]
run = "./scripts/build-mpeg2toh264.sh"

# GraphQL のクエリから、Relay の型とアーティファクト (__generated__) を生成する。
# watchman があれば使おうとするが、使わなくても足りるので切る。
# 静的なデモの映像 (demo/stream.m2ts) を、scripts/build-demo-stream.sh で作り直す (設計書 10.1、#1050)。
# FFmpeg は mise.demo-stream.toml で固定しているので、MISE_ENV=demo-stream を付けて実行する。
[tasks.demo-stream]
depends = ["install"]
run = "./scripts/build-demo-stream.sh"

[tasks.relay]
depends = ["install"]
env = { FORCE_NO_WATCHMAN = "1" }
run = [
  # relay-compiler は、元の graphql タグを消した生成物を消さない (--validate でも見つからない)。
  # 一度すべて消してから生成し、残った古い生成物を CI の git diff で見つけられるようにする (#860)。
  "find src -path '*/__generated__/*.graphql.ts' -delete",
  "pnpm exec relay-compiler",
]

[tasks.build]
depends = ["relay"]
run = "pnpm exec vp build"

# 静的なデモ (#832)。tenban なしに画面を触れるよう、応答をブラウザの中で返す。
# Cloudflare Pages のサイトの直下に置き、dist/demo に出力する。Cloudflare Pages は、frontend の pnpm run build:demo でビルドする。
[tasks.demo]
depends = ["relay"]
run = "pnpm exec vp build --mode demo --outDir dist/demo"

[tasks.check]
depends = ["relay"]
run = "pnpm exec vp check"

[tasks.test]
depends = ["relay"]
run = "pnpm exec vp test run"

[tasks.storybook]
depends = ["relay"]
run = "pnpm exec storybook build --quiet"

# E2E テスト。ビルド済みの SPA を vp preview で配信して確かめる。
# Chromium は pnpm exec playwright install chromium で入れるか、KOTATSU_E2E_CHROMIUM に手元のものを指定する。
[tasks.e2e]
depends = ["build"]
run = "pnpm exec playwright test --project=spa"

# README のスクリーンショットを、静的なデモから撮り、../docs/screenshots に書き出す (#621)。
# 正とするのは CI で撮ったもの。手元ではフォントなどが違うので、撮るとすべて書き換わる。
[tasks.screenshots]
depends = ["demo"]
run = "pnpm exec playwright test -c playwright.screenshots.config.ts"

# サーバーの goja で動かす zxcvbn-ts のバンドル (設計書 2.2) を作り、gzip で ../backend/internal/lib/password に置く。
[tasks.zxcvbn]
depends = ["install"]
run = [
  "pnpm exec vp build --config zxcvbn/vite.config.ts",
  "gzip -9nc zxcvbn/dist/zxcvbn.js > ../backend/internal/lib/password/zxcvbn.js.gz",
]

[tasks.dev]
depends = ["install"]
run = "pnpm exec vp dev"
