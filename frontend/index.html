<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover で、画面の端 (ノッチや、ブラウザのタブで見たときのジェスチャーナビゲーションの帯) の下までページを描く。 -->
    <!-- theme-color は、表示中のテーマに合わせて useThemeColor が書き換える (#425)。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ff7407" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <!-- iOS 27 は、URL で指したアイコンをホーム画面に使えないので、ビルド時に data: URL を埋め込む (#582、vite.config.ts)。 -->
    <link rel="apple-touch-icon" sizes="180x180" href="__KOTATSU_APPLE_TOUCH_ICON__" />
    <title>Kotatsu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
