  """
  drops: Int64!
  errors: Int64!
  scrambled: Int64!
}
"""
セグメントのファイルが見つからない録画 (設計書 5.6)。Kotatsu を通さずにファイルを消すと、録画の一覧に残り続けるので、探して DB から消す。
