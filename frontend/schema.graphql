scalar Int64
"""
NX-Jikkyo の実況のチャンネル。
"""
type JikkyoChannel {
  """
  jk1 などの ID。NX-Jikkyo の WebSocket の URL に使う。
  """
  id: String!
  name: String!
  """
  勢い (1 分あたりのコメントの数。#490)。NX-Jikkyo の値を 1 分ほど使い回す。放送中のスレッドがなければ null。
  """
  force: Int
  """
