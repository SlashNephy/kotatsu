  updateNotificationPreference(input: NotificationPreferenceInput!): NotificationPreference!
  """
  認可のリクエストに同意し、認可コードを付けてクライアントへ戻す URL を返す。scopes は、同意するスコープ。
  求められたもので、ロールに許すものでなければ BAD_USER_INPUT を返す。直近 10 分以内の認証が要る。
