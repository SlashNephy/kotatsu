  """
  createWatchRule(input: WatchRuleInput!): WatchRule!
  """
  ログイン中のユーザーの視聴ルールの内容を input で置き換える。視聴ルールが付けた視聴予約のうち、一致しなくなったものは、次の照合で外す。
  """
  updateWatchRule(id: ID!, input: WatchRuleInput!): WatchRule!
