  """
  revokeOtherSessions: Int!
  """
  ログイン中のユーザーの、番組の視聴予約を付け外しする。付けてある番組に付けても、付けていない番組から外しても、そのまま返す。
  放送が始まった番組と、過去の番組には付けられない。閲覧だけのユーザーも使える。
