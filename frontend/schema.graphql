  viewers: Int
}
"""
キーワードと、その照合の仕方。
"""
type Keyword {
  text: String!
  regexp: Boolean!
  caseSensitive: Boolean!
  fields: [KeywordField!]!
}
"""
キーワードを照合する番組の項目。
"""
enum KeywordField {
  """
  番組名
  """
  NAME
  """
  概要
  """
  DESCRIPTION
  """
  詳細
  """
  EXTENDED
}
"""
キーワードと、その照合の仕方 (設計書 4.2)。キーワードと番組の文字列は、NFKC で正規化してから比べる。
"""
input KeywordInput {
  text: String!
  """
  text を正規表現 (RE2) として扱うかどうか。
  """
  regexp: Boolean! = false
  caseSensitive: Boolean! = false
  """
  照合する項目。どれか 1 つに一致すれば、このキーワードに一致したとみなす。
  """
  fields: [KeywordField!]!
}
"""
含めるキーワードの照合のしかた。
"""
enum KeywordMatch {
  """
  すべてのキーワードに一致する番組を対象にする
  """
  ALL
  """
  いずれかのキーワードに一致する番組を対象にする
  """
  ANY
}
"""
ミュートするキーワードの照らし方。大文字と小文字、全角と半角は区別しない (正規表現は大文字と小文字だけ区別しない)。
"""
enum KeywordMuteMatch {
  """
  どこかに含む
  """
  PARTIAL
  """
  で始まる
  """
  PREFIX
  """
  で終わる
  """
  SUFFIX
  """
  と一致する
  """
  EXACT
  """
  正規表現 (JavaScript の RegExp) に一致する
  """
  REGEX
}
"""
リーダー選出のリース (設計書 1.4)。neko のリースを持つインスタンスだけがアクティブになる。
"""
type Lease {
  name: String!
  """
  リースを持っているインスタンスの ID。
  """
  holderInstanceId: String!
  generation: Int!
  acquiredAt: Time!
  expiresAt: Time!
  """
  期限が切れていないかどうか。
  """
  valid: Boolean!
}
"""
ライブのサービスの、PID の種類ごとのビットレートと、TS のパケットの異常の数 (#812)。
"""
type LiveStreamRates {
  """
  映像のビットレート (bps)。
  """
  videoBps: Int!
  """
  音声のビットレート (bps)。
  """
  audioBps: Int!
  """
  字幕、文字スーパー、データ放送など、映像と音声のほかの ES のビットレート (bps)。
  """
  otherBps: Int!
  """
  PAT、PMT と、決まった PID で送る SI のビットレート (bps)。
