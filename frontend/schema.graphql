}
"""
チューナーサーバーにつながっているかどうか (設計書 3.7)。ログイン中の誰でも読め、画面に縮退中であることを示すのに使う。
理由などの詳しいことは、管理者向けの systemStatus で返す。
"""
type TunerServerHealth {
  """
  接続できない縮退中かどうか。まだ確かめていなければ false。
  """
  degraded: Boolean!
  """
  縮退が始まった日時。縮退中でなければ null。
  """
  degradedSince: Time
  """
  チューナーサーバーの時計の差が、警告する閾値を超えているかどうか。録画の開始と終了がずれうる。
  """
  clockSkewed: Boolean!
  """
  チューナーサーバーの時計と OS の時計の差 (ミリ秒)。分からなければ null。
  """
  clockSkewMs: Int
}
"""
チューナーサーバーの状態 (設計書 3.7)。
"""
type TunerServerStatus {
  """
  接続できない縮退中かどうか。
  """
  degraded: Boolean!
  degradedSince: Time
  """
  最後に接続に失敗した理由。
  """
  lastError: String!
  """
  チューナーサーバーの時計と OS の時計の差 (ミリ秒)。分からなければ null。
  """
  clockSkewMs: Int
  """
  時計の差が、警告する閾値を超えているかどうか。
  """
  clockSkewed: Boolean!
  """
  時計の差を警告する閾値 (ミリ秒)。
  """
  clockSkewThresholdMs: Int!
  checkedAt: Time!
}
"""
ユーザーの変える項目。省いた項目は変えない。
"""
input UpdateUserInput {
  displayName: String
  role: Role
}
"""
Webhook の変える項目。省いた項目は変えない。署名用の秘密キーは変えない。
"""
input UpdateWebhookInput {
  name: String
  url: String
  format: WebhookFormat
  kinds: [NotificationKind!]
  enabled: Boolean
}
type User implements Node {
  id: ID!
  username: String!
  displayName: String!
  role: Role!
  """
  無効にしたユーザーかどうか。無効にしたユーザーは、ログインできない。
  """
  disabled: Boolean!
  createdAt: Time!
  """
  アイコンの画像の URL (#778)。IdP の picture を中継する。IdP が picture を返さないユーザーは null。
  """
  avatarUrl: String
}
"""
サーバー側でのトランスコード (kyusu) の映像のコーデック。
"""
enum VideoCodec {
  H264
  HEVC
}
"""
放送の映像の種類 (設計書 7.1)。再生の経路を選ぶのに使う (#806)。
"""
enum VideoFormat {
  """
  2K 以下の映像 (地上波、BS、CS)。ブラウザ内での変換で再生できる。
  """
  HD
  """
  BS4K の 2160p の HEVC。ブラウザ内での変換では再生できない。
  """
  UHD
  """
  BS8K の 4320p の HEVC。ブラウザでは再生できない。
  """
  SHV
}
"""
ヘッダーで購読する、ログイン中のユーザーへの知らせ (設計書 9.1)。1 つの知らせには、どれか 1 つだけが入る。
dataChanged、viewerSettingsChanged、unreadNotificationCount を、1 つの接続でまとめて送る。
"""
type ViewerEvent {
  dataChange: DataChange
  viewerSettingsVersion: Int
  unreadNotificationCount: Int
  """
  この tenban が止まる前に、流しているストリームを、新しい接続を張ってから切り替えてほしいという知らせ (設計書 7.2、#1085)。
  届くときは常に true。届いてから一定の時間 (20 秒) が過ぎると、この tenban は、残ったストリームを打ち切る。
  """
  streamsDraining: Boolean
}
"""
視聴予約の通知の設定。端末をまたいで同期する。
"""
type WatchReminderSettings {
  """
  放送の何分前に通知を送るか。0 から 60 まで。
  """
  minutesBefore: Int!
}
"""
視聴予約 (設計書 4.8)。録画はせず、放送の少し前に、予約したユーザーだけに通知する。
"""
type WatchReservation {
  program: Program!
  """
  通知を送る日時。番組の放送時間が変わると、付いていく。
  """
  notifyAt: Time!
  createdAt: Time!
}
"""
視聴ルール (設計書 4.8)。条件に一致する放送前の番組に、持ち主の視聴予約を自動で付ける。
録画のルールと違ってユーザーごとの個人のもので、閲覧だけのユーザーも作れる。ほかのユーザーの視聴ルールは見えない。
"""
type WatchRule implements Node {
  id: ID!
  name: String!
  enabled: Boolean!
  """
  番組の条件。録画のルールと同じ形で、同じく照合する。
  """
  conditions: ProgramConditions!
  createdAt: Time!
  updatedAt: Time!
}
"""
視聴ルールの内容。
"""
input WatchRuleInput {
  """
  1〜200 文字
  """
  name: String!
  enabled: Boolean! = true
  conditions: ProgramConditionsInput!
}
"""
Web Push の購読 (設計書 6.2)。端末とブラウザごとに 1 つある。
"""
type WebPushSubscription {
  id: ID!
  """
  プッシュサービスの送り先の URL。
  """
  endpoint: String!
  """
  購読した端末の User-Agent。端末を見分けるのに使う。
  """
  userAgent: String!
  createdAt: Time!
}
"""
ブラウザの PushSubscription。PushSubscription.toJSON() の値をそのまま渡せる。
"""
input WebPushSubscriptionInput {
  endpoint: String!
  """
  ブラウザの P-256 の公開鍵を base64url にしたもの。
  """
  p256dh: String!
  """
  認証用の秘密を base64url にしたもの。
  """
  auth: String!
}
"""
管理者が設定した Webhook (設計書 6.2)。通知するイベントを、外部のサービスに送る。
"""
type Webhook {
  id: ID!
  name: String!
  """
  送り先の URL。Discord や Slack の URL は、それ自体が秘密のトークンを含む。
  """
  url: String!
  format: WebhookFormat!
  """
  送るイベントの種類。
  """
  kinds: [NotificationKind!]!
  enabled: Boolean!
  createdAt: Time!
  updatedAt: Time!
}
"""
Webhook で送る形式 (設計書 6.2)。
"""
enum WebhookFormat {
  """
  汎用の JSON
  """
  JSON
  """
  Discord の Webhook
  """
  DISCORD
  """
  Slack の Incoming Webhook
  """
  SLACK
}
