  """
  excludeServices: [ID!]
  genres: [GenreInput!]
  excludeGenres: [GenreInput!]
  timeRanges: [TimeRangeInput!]
  minDurationSeconds: Int
  maxDurationSeconds: Int
  freeOnly: Boolean
  """
  番組名の囲み文字 (中身で指定する。「新」や「字」など。括弧で書いた [新] なども同じとみなす) のどれか 1 つを持つ番組を対象にする。
  """
