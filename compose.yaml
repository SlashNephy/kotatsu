# 開発のための Docker Compose の構成 (docs/development.md)。手元のソースをマウントして Kotatsu と画面の開発サーバーを動かし、
# 偽のチューナー、PostgreSQL、Dex と一緒に動かす。ソースを保存すると、Go はビルドし直して起動し直し、画面はその場で差し替わる。
# 運用の例は deploy/compose/compose.yaml にある。こちらは開発専用で、秘密キーも固定の値を使うので、運用には使わない。
#
#   mise run dev
#
# http://localhost:8080/ で画面を開ける (ポートは KOTATSU_DEV_PORT で変えられる)。Dex の admin@example.com (パスワードは password) でログインすると、管理者が作られる。
name: kotatsu-dev

# ソースをマウントして動かすサービスの共通の設定。
# コンテナの中で生成したファイルが手元のユーザーの持ち物になるよう、イメージを手元のユーザーの UID と GID で作る (mise run dev が渡す)。
x-dev: &dev
  build:
    context: .
    target: dev
    args:
      UID: ${DEV_UID:-1000}
      GID: ${DEV_GID:-1000}
  image: kotatsu-dev
  volumes:
    - .:/src
    - go-mod:/go/pkg/mod
    - go-build:/go/cache

services:
  # DB を使う Go のテストも、ここに向けられる (KOTATSU_TEST_DATABASE_URL)。
  postgres:
    image: docker.io/library/postgres:18@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kotatsu
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      # PostgreSQL 18 のイメージは、/var/lib/postgresql をボリュームにし、データを /var/lib/postgresql/18/docker に置く。
      # 17 までの /var/lib/postgresql/data ではない。
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  # 偽のチューナーサーバー。backend/testdata/ts/test.ts を、すべてのサービスのストリームとして流す。
  faketuner:
    <<: *dev
    command: ["exec", "--", "go", "run", "./backend/cmd/faketuner", "-listen", "0.0.0.0:40772", "-ts", "backend/testdata/ts/test.ts"]
    ports:
      - "127.0.0.1:40772:40772"

  # 開発用の OIDC の IdP。admin、member、viewer のユーザーで、パスワードだけでログインできる (docker/dex/kotatsu.yaml)。
  dex:
    image: ghcr.io/dexidp/dex:v2.46.1@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab
    command: ["dex", "serve", "/etc/dex/kotatsu.yaml"]
    environment:
      KOTATSU_DEV_PORT: ${KOTATSU_DEV_PORT:-8080}
    ports:
      - "127.0.0.1:5556:5556"
    volumes:
      - ./docker/dex/kotatsu.yaml:/etc/dex/kotatsu.yaml:ro
    networks:
      default:
        # issuer の dex.localhost を、Kotatsu のコンテナからも引けるようにする。
        aliases: [dex.localhost]

  # 録画と生成物、タイムシフトのバッファを置くボリュームは root の持ち物になるので、Kotatsu が書けるよう、持ち主を開発用のイメージのユーザーにする。
  recordings-owner:
    image: docker.io/library/postgres:18@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    command: ["chown", "${DEV_UID:-1000}:${DEV_GID:-1000}", "/recordings", "/data", "/timeshift"]
    user: root
    volumes:
      - recordings:/recordings
      - data:/data
      - timeshift:/timeshift

  # Go のソースを保存するたびに、ビルドし直し、マイグレーションを当ててから、全ロールを起動し直す (mise.dev.toml の dev:server)。
  # 前のプロセスを止めてからビルドするので、ビルドの間の数秒は応答しない (web は 502 を返す)。
  kotatsu:
    <<: *dev
    command: ["run", "//backend:dev:server"]
    environment:
      KOTATSU_DATABASE_URL: postgres://postgres:postgres@postgres:5432/kotatsu?sslmode=disable
      # 開発専用の固定の秘密キー。運用では、ランダムな値を Secret で渡す。
      KOTATSU_AUTH_SECRET_KEY: kotatsu-development-only-secret-key-do-not-use
      # 実際のチューナーサーバーにつなぐときは、KOTATSU_DEV_TUNER_URL で渡す。渡さなければ、偽のチューナーサーバーにつなぐ。
      KOTATSU_TUNER_URL: ${KOTATSU_DEV_TUNER_URL:-http://faketuner:40772/}
      KOTATSU_STORAGE_POOLS: main=/recordings
      KOTATSU_STORAGE_DATA_DIR: /data
      # タイムシフトを画面から試せるよう、バッファの置き場所を設定しておく。録るサービスを選ぶまでは何も録らない。
      KOTATSU_STORAGE_TIMESHIFT_DIR: /timeshift
      KOTATSU_SERVER_LISTEN: ":8080"
      # Dex でログインし、グループからロールを決めてユーザーを作る。パスワードと第二要素の登録を省ける。
      KOTATSU_AUTH_OIDC_ISSUER: http://dex.localhost:5556/dex
      KOTATSU_AUTH_OIDC_CLIENT_ID: kotatsu
      KOTATSU_AUTH_OIDC_CLIENT_SECRET: kotatsu-development-only-client-secret
      KOTATSU_AUTH_OIDC_SCOPES: openid,profile,email,groups
      KOTATSU_AUTH_OIDC_DISPLAY_NAME: Dex
      KOTATSU_AUTH_OIDC_AUTO_CREATE_ENABLED: "true"
      KOTATSU_AUTH_OIDC_AUTO_CREATE_GROUPS_CLAIM: groups
      KOTATSU_AUTH_OIDC_AUTO_CREATE_ADMIN_GROUPS: admins
      KOTATSU_AUTH_OIDC_AUTO_CREATE_MEMBER_GROUPS: members
      KOTATSU_AUTH_OIDC_AUTO_CREATE_VIEWER_GROUPS: viewers
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/go/cache
      - recordings:/recordings
      - data:/data
      - timeshift:/timeshift
    depends_on:
      postgres:
        condition: service_healthy
      recordings-owner:
        condition: service_completed_successfully
      faketuner:
        condition: service_started
      dex:
        condition: service_started
    # 初めのビルドとマイグレーションが終わり、DB に届くようになったら、準備ができたとみなす (/readyz)。
    # イメージに curl がないので、bash で HTTP を話す。
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      # 新しいボリュームでは、Go の依存の取得と初めのビルドに数分かかる。その間は失敗を数えない。
      start_period: 10m
      start_interval: 2s
    # ビルドの成果物とキャッシュを書くので、ルートファイルシステムは読み取り専用にしない。
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # 画面の依存を、frontend/node_modules のボリュームに入れる。pnpm-lock.yaml を変えたら、docker compose up web-install で入れ直す。
  web-install:
    <<: *dev
    command: ["run", "//frontend:install"]
    volumes:
      - .:/src
      - web-node-modules:/src/frontend/node_modules

  # 画面の開発サーバー (Vite)。ブラウザはここを開き、API と映像は Kotatsu に中継される。保存した画面の変更は、その場で差し替わる。
  web:
    <<: *dev
    command: ["run", "//frontend:dev:web"]
    environment:
      KOTATSU_DEV_API: http://kotatsu:8080
    ports:
      # ほかのアプリが 8080 を使っていれば、KOTATSU_DEV_PORT で変える。
      - "127.0.0.1:${KOTATSU_DEV_PORT:-8080}:8080"
    volumes:
      - .:/src
      - web-node-modules:/src/frontend/node_modules
    depends_on:
      web-install:
        condition: service_completed_successfully
      # Kotatsu より先に画面を開けると、初めのビルドの間は API が 502 を返し、画面が読み込みに失敗したままになる。
      kotatsu:
        condition: service_healthy

  # SQL のクエリやスキーマ、GraphQL のスキーマを変えたら、sqlc と gqlgen の生成物と、画面が読むスキーマを作り直す (mise.dev.toml の dev:generate)。
  generate:
    <<: *dev
    command: ["run", "//backend:dev:generate"]

  # 画面のクエリやスキーマを変えたら、Relay の生成物を作り直す (mise.dev.toml の dev:relay)。
  relay:
    <<: *dev
    command: ["run", "//frontend:dev:relay"]
    volumes:
      - .:/src
      - web-node-modules:/src/frontend/node_modules
    depends_on:
      web-install:
        condition: service_completed_successfully

volumes:
  # DB と録画は、KOTATSU_DEV_DB を渡すと、その名前を付けた別のボリュームを使う (KOTATSU_DEV_DB=real なら kotatsu-dev_postgres-real)。
  # 偽のチューナーサーバーと実際のチューナーサーバーで、番組表や録画が混ざらないようにする。渡さなければ、これまでのボリュームを使う。
  postgres:
    name: kotatsu-dev_postgres${KOTATSU_DEV_DB:+-${KOTATSU_DEV_DB}}
  recordings:
    name: kotatsu-dev_recordings${KOTATSU_DEV_DB:+-${KOTATSU_DEV_DB}}
  # 索引や代表画像などの生成物は、録画と組なので、同じく KOTATSU_DEV_DB で分ける。
  data:
    name: kotatsu-dev_data${KOTATSU_DEV_DB:+-${KOTATSU_DEV_DB}}
  # タイムシフトのバッファも、録画と同じく KOTATSU_DEV_DB で分ける。
  timeshift:
    name: kotatsu-dev_timeshift${KOTATSU_DEV_DB:+-${KOTATSU_DEV_DB}}
  # 開発用のイメージのユーザーの持ち物にするので、root で使っていた以前のボリュームとは名前を変える。
  go-mod:
    name: kotatsu-dev_dev-go-mod
  go-build:
    name: kotatsu-dev_dev-go-build
  web-node-modules:
