  曜日の集合 (0 が日曜日、6 が土曜日)
  """
  weekdays: [Int!]!
  """
  0 時からの分で表した範囲の始まり (0〜1439)
  """
  startMinute: Int!
  """
  範囲の長さ (分)。日付をまたいでよい。
  """
  durationMinutes: Int!
}
"""
時刻予約の内容。長さは 24 時間まで。
"""
input TimeReservationInput {
  service: ID!
  startAt: Time!
  endAt: Time!
  """
  画面に出す名前。200 文字まで。
  """
  name: String! = ""
  settings: RecordingSettingsOverridesInput
}
type User implements Node {
  id: ID!
  username: String!
  displayName: String!
  role: Role!
}
