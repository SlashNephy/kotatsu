  この番組の予約。予約がなければ null。
  """
  reservation: Reservation
  """
  放送が終わり、アーカイブに移した番組かどうか。
  """
  archived: Boolean!
}
"""
番組の条件 (設計書 4.2)。空の項目では絞り込まない。
"""
type ProgramConditions {
  keywords: [Keyword!]!
  excludeKeywords: [Keyword!]!
  channelTypes: [String!]!
  services: [Service!]!
  genres: [GenreCondition!]!
  excludeGenres: [GenreCondition!]!
  timeRanges: [TimeRange!]!
  minDurationSeconds: Int
  maxDurationSeconds: Int
  freeOnly: Boolean!
}
"""
番組の条件 (設計書 4.2)。番組の検索とルールで共通に使う。省いた項目では絞り込まない。
"""
input ProgramConditionsInput {
  """
  すべてに一致する番組だけを対象にする。
  """
  keywords: [KeywordInput!]
  """
  どれか 1 つに一致したら除外する。
  """
  excludeKeywords: [KeywordInput!]
  """
  チャンネル種別とサービスは、どちらかに含まれていれば対象にする。
  """
  channelTypes: [String!]
  services: [ID!]
  genres: [GenreInput!]
  excludeGenres: [GenreInput!]
  timeRanges: [TimeRangeInput!]
  minDurationSeconds: Int
  maxDurationSeconds: Int
  freeOnly: Boolean
}
type ProgramConnection {
  edges: [ProgramEdge!]!
  pageInfo: PageInfo!
}
type ProgramEdge {
  cursor: String!
  node: Program!
}
"""
番組予約の内容。
"""
input ProgramReservationInput {
  program: ID!
  followEventRelay: Boolean! = true
  settings: RecordingSettingsOverridesInput
}
type Query {
  """
  ログイン中のユーザー。
  """
  viewer: User!
  """
  監査ログを、新しい順に first 件まで返す。管理者だけが使える (設計書 9.7)。
  """
  auditEvents(first: Int! = 50, after: String, filter: AuditEventFilter): AuditEventConnection!
  """
  システムの状態。管理者だけが使える (設計書 9.7)。
  """
  systemStatus: SystemStatus!
  """
  ID で引く (Relay の Global Object Identification)。見つからなければ NOT_FOUND のエラーを返す。
  """
  node(id: ID!): Node
  """
  チャンネル種別を、並び順に並べたもの。
  """
  channelTypes: [ChannelType!]!
  """
  サービスを、番組表の並び順に並べたもの。
  """
  services(
    """
    非表示のサービスも含めるかどうか
    """
    includeHidden: Boolean! = false
  ): [Service!]!
  """
  番組表。from から to までの時間帯に重なる番組を、サービスごとに返す。時間帯は 7 日まで。
  services を省くと、非表示でないすべてのサービスを返す。指定すると、非表示のサービスも返す。
  view を指定すると、その番組表ビューの条件で、番組を絞り込み、サービスを並べ替える。
  """
  guide(from: Time!, to: Time!, services: [ID!], view: ID): [GuideRow!]!
  """
  ログイン中のユーザーの番組表ビュー。
  """
  guideViews: [GuideView!]!
  """
  ログイン中のユーザーの通知を、新しい順に first 件まで返す。unreadOnly なら未読だけを返す。
  """
  notifications(first: Int! = 50, after: String, unreadOnly: Boolean! = false): NotificationConnection!
  """
  ログイン中のユーザーの未読の通知の数。
  """
  unreadNotificationCount: Int!
  """
  ログイン中のユーザーの通知設定を、すべての種類について返す。設定していない種類は、どの通知先でも受け取る。
  """
  notificationPreferences: [NotificationPreference!]!
  """
  ログイン中のユーザーのパスキー。登録した順に並べる。
  """
  passkeys: [Passkey!]!
  """
  録画を、録画を始めた日時の新しい順に first 件まで返す。
  """
  recordings(first: Int! = 50, after: String, filter: RecordingFilter): RecordingConnection!
  """
  タグを、名前の順に返す。
  """
  tags: [Tag!]!
  """
  時間帯 [from, to) に重なる予約を、開始時刻の順に返す。
  states を指定すると、その割り当ての状態の予約だけを返す。
  """
  reservations(from: Time!, to: Time!, states: [AssignmentState!],
    """
    返す件数 (1〜100)
    """
    first: Int! = 50
  after: String): ReservationConnection!
  """
  すべてのルールを、作った順に返す。
  """
  rules: [Rule!]!
  """
  保存する前のルールに一致する番組を、開始時刻の順に返す (設計書 4.3)。
  ルールの照合と同じく、放送が始まった番組、終了時刻が未定の番組、ルールの有効期間の外の番組は含めない。
  重複の回避は考えない。first、after と hasNextPage の扱いは searchPrograms と同じ。
  """
  previewRule(input: RuleInput!,
    """
    返す件数 (1〜100)
    """
    first: Int! = 50
  after: String): ProgramConnection!
  """
  番組の検索 (設計書 3.5)。ルールの照合と同じ照合関数で、開始時刻の順に返す。
  archive を指定したときだけ、その期間の放送が終わった番組も検索する。
  1 回に照合する番組の数には上限があり、上限に達すると、first 件に満たなくても hasNextPage を true にして返す。
  そのときは、pageInfo.endCursor から続きを検索する。
  """
  searchPrograms(conditions: ProgramConditionsInput!, archive: ArchiveRangeInput,
    """
    返す件数 (1〜100)
    """
    first: Int! = 50
  after: String): ProgramConnection!
  """
  ログイン中のユーザーの第二要素の状態。
  """
  secondFactors: SecondFactorStatus!
  """
  全体の設定。ログイン中のユーザーなら誰でも読める。
  """
  systemSettings: SystemSettings!
  """
  すべてのユーザーを、作った順に返す。管理者だけが使える (設計書 9.7)。
  """
  users: [User!]!
  """
  ログイン中のユーザーの、使えるセッションを、最後に使われた順に返す。
  """
  sessions: [Session!]!
  """
  ブラウザが購読するときに applicationServerKey に渡す、VAPID の公開鍵を base64url にしたもの。
  """
  webPushPublicKey: String!
  """
  ログイン中のユーザーの Web Push の購読を、古い順に返す。
  """
  webPushSubscriptions: [WebPushSubscription!]!
  """
  Webhook を作った順に返す。管理者だけが使える (設計書 9.7)。
  """
  webhooks: [Webhook!]!
}
"""
録画 (設計書 5.5、8.2)。
"""
type Recording implements Node {
  id: ID!
  service: Service!
  """
  番組の eventId。時刻予約の録画では null。
  """
  eventId: Int
  name: String!
  description: String!
  """
  番組の放送の開始と終了。
  """
  startAt: Time!
  endAt: Time!
  state: RecordingState!
  """
  失敗した理由。失敗していなければ null。
  """
  failureReason: RecordingFailureReason
  """
  保護の印。保護した録画は、容量の管理でも、ユーザーの操作でも消さない。
  """
  protected: Boolean!
  """
  全 PID のドロップ、エラー、スクランブルの数。
  """
  drops: Int64!
  errors: Int64!
  scrambled: Int64!
  gaps: [RecordingGap!]!
  """
  録画中に番組が EPG から消えたかどうか。
  """
  programLost: Boolean!
  """
  実際に録画を始めた日時と、終えた日時。録画中なら終えた日時は null。
  """
  recordedFrom: Time!
  recordedUntil: Time
  """
  名前の順。
  """
  tags: [Tag!]!
  files: [RecordingFile!]!
  """
  ログイン中のユーザーの再生位置 (ミリ秒)。再生していなければ null。
  """
  watchPositionMs: Int64
}
type RecordingConnection {
  edges: [RecordingEdge!]!
  pageInfo: PageInfo!
}
type RecordingEdge {
  cursor: String!
  node: Recording!
}
"""
録画に失敗した理由 (設計書 5.5)。
"""
enum RecordingFailureReason {
  """
  チューナーを確保できなかった
  """
  TUNER_UNAVAILABLE
  """
  チューナーサーバーに接続できなかった
  """
  TUNER_SERVER_UNREACHABLE
  """
  ストリームが中断し、再接続もできなかった
  """
  STREAM_INTERRUPTED
  """
  保存先に書き込めなかった
  """
  STORAGE_UNAVAILABLE
  """
  保存先の容量が足りなかった
  """
  STORAGE_FULL
  """
  番組が見つからなかった
  """
  PROGRAM_NOT_FOUND
  """
  録画を取り消した
  """
  CANCELLED
}
"""
録画のファイル。
"""
type RecordingFile {
  kind: RecordingFileKind!
  """
  保存先プールの ID。
  """
  poolId: String!
  """
  プール内の相対パス。
  """
  path: String!
  """
  大きさ (バイト)。
  """
  size: Int64!
  startedAt: Time!
  """
  書き終えた日時。書いている間は null。
  """
  endedAt: Time
}
"""
録画のファイルの種類。
"""
enum RecordingFileKind {
  """
  TS のセグメント
  """
  SEGMENT
  """
  セグメントの索引
  """
  INDEX
  """
  代表画像 (JPEG)
  """
  THUMBNAIL
  """
  シークバー用のプレビュー画像 (JPEG)。コマの並びは、同じディレクトリの preview.json に書く
  """
  PREVIEW
  """
  EPGStation から取り込んだ、エンコード済みの MP4 のような TS 以外のファイル
  """
  OTHER
}
"""
録画の絞り込み。省いた条件は絞り込まない。
"""
input RecordingFilter {
  """
  どれかのタグが付いた録画。
  """
  tagIds: [ID!]
  states: [RecordingState!]
  serviceIds: [ID!]
  """
  番組名に含む文字列。大文字と小文字を区別しない。
  """
  keyword: String
  """
  放送の開始がこの日時以降の録画。
  """
  since: Time
  """
  放送の開始がこの日時より前の録画。
  """
  until: Time
}
"""
途切れた区間。
"""
type RecordingGap {
  from: Time!
  to: Time!
}
"""
録画設定 (設計書 4.7)。全体の既定値に、ルールや予約の上書きを重ねる。
"""
type RecordingSettings {
  """
  保存先プール。null なら、推定サイズが収まるプールを選ぶ。
  """
  poolId: String
  """
  ファイル名の text/template
  """
  fileNameTemplate: String!
  startMarginSeconds: Int!
  endMarginSeconds: Int!
  """
  優先度 (-10〜10)。チューナーが足りないときは、高い予約から割り当てる。
  """
  priority: Int!
}
"""
録画設定の上書き (設計書 4.7)。null の項目は全体の既定値を使う。
"""
type RecordingSettingsOverrides {
  """
  保存先プール
  """
  poolId: String
  """
  ファイル名の text/template
  """
  fileNameTemplate: String
  startMarginSeconds: Int
  endMarginSeconds: Int
  """
  優先度 (-10〜10)。チューナーが足りないときは、高い予約から割り当てる。
  """
  priority: Int
}
"""
録画設定の上書き。省いた項目は全体の既定値を使う。
"""
input RecordingSettingsOverridesInput {
  poolId: String
  fileNameTemplate: String
  startMarginSeconds: Int
  endMarginSeconds: Int
  priority: Int
}
"""
録画の状態 (設計書 5.5)。
"""
enum RecordingState {
  """
  録画中
  """
  RECORDING
  """
  完了
  """
  COMPLETED
  """
  ドロップのある完了
  """
  COMPLETED_WITH_ERRORS
  """
  途切れた区間のある一部のみ
  """
  PARTIAL
  """
  失敗
  """
  FAILED
}
"""
リカバリーコード。この応答でしか見せないので、ユーザーに控えてもらう。
"""
type RecoveryCodes {
  codes: [String!]!
}
"""
予約 (設計書 4.1)。番組予約とルール予約は、作ったときの番組情報のコピーを持つ。予約は家族で共有する (設計書 9.7)。
"""
type Reservation implements Node {
  id: ID!
  kind: ReservationKind!
  service: Service!
  """
  番組の eventId。時刻予約では null。
  """
  eventId: Int
  startAt: Time!
  endAt: Time!
  name: String!
  description: String!
  genres: [Genre!]!
  enabled: Boolean!
  """
  イベントリレーで引き継がれた番組を、引き継ぎ先でも予約するかどうか (設計書 4.6)。
  """
  followEventRelay: Boolean!
  """
  この予約自体の録画設定の上書き。ルール予約では、一致したルールのうち最も古いものの上書きに、さらにこれを重ねる。
  """
  settings: RecordingSettingsOverrides!
  assignment: ReservationAssignment!
  """
  予約に一致したルール。ルールを作った順に並べる。
  """
  rules: [Rule!]!
  createdAt: Time!
  """
  作成者。neko が作ったか、ユーザーが消えていれば null。
  """
  createdBy: User
  updatedAt: Time!
  updatedBy: User
}
"""
予約のチューナーの割り当ての結果。neko が計算し直すたびに変わる。
"""
type ReservationAssignment {
  state: AssignmentState!
  """
  割り当てたチューナーの番号。割り当てていなければ null。
  """
  tuner: Int
  """
  マージンを削った後の、録画する予定の時刻。割り当てていなければ null。
  """
  plannedStartAt: Time
  plannedEndAt: Time
}
type ReservationConnection {
  edges: [ReservationEdge!]!
  pageInfo: PageInfo!
}
type ReservationEdge {
  cursor: String!
  node: Reservation!
}
"""
予約の種類 (設計書 4.1)。
"""
enum ReservationKind {
  """
  番組予約。番組の放送時間の変更とイベントリレーに追従する。
  """
  PROGRAM
  """
  時刻予約。サービスと、開始と終了の時刻を指定する。番組の変更には追従しない。
  """
  TIME
  """
  ルール予約。ルールが自動で作る。
  """
  RULE
}
"""
予約の変更。省いた項目は変えない。
"""
input ReservationUpdateInput {
  enabled: Boolean
  followEventRelay: Boolean
  """
  録画設定の上書きを、丸ごと置き換える。
  """
  settings: RecordingSettingsOverridesInput
  """
  startAt、endAt、name は、時刻予約でだけ変えられる。番組予約の時刻と名前は EPG に従う。
  """
  startAt: Time
  endAt: Time
  name: String
}
"""
ユーザーのロール (設計書 9.7)。
"""
enum Role {
  """
  管理者
  """
  ADMIN
  """
  メンバー
  """
  MEMBER
  """
  視聴者
  """
  VIEWER
}
"""
ルール (設計書 4.2)。ルールは家族で共有し、メンバーなら誰が作ったものでも変えられる (設計書 9.7)。
"""
type Rule implements Node {
  id: ID!
  name: String!
  memo: String!
  enabled: Boolean!
  conditions: ProgramConditions!
  settings: RecordingSettingsOverrides!
  """
  ルール自体の有効期間。番組の開始時刻がこの範囲に入るときだけ予約する。null なら区切らない。
  """
  validFrom: Time
  validUntil: Time
  """
  同じ番組名を duplicateWindowDays 日以内に録画済みなら予約しないかどうか (設計書 4.4)。
  """
  avoidDuplicates: Boolean!
  """
  重複を避ける期間 (日)。null なら期間を区切らない。
  """
  duplicateWindowDays: Int
  """
  イベントリレーで引き継がれた番組を、引き継ぎ先でも予約するかどうか (設計書 4.6)。
  """
  followEventRelay: Boolean!
  createdAt: Time!
  """
  作成者。ユーザーが消えていれば null。
  """
  createdBy: User
  updatedAt: Time!
  updatedBy: User
}
"""
ルールの内容。
"""
input RuleInput {
  """
  1〜200 文字
  """
  name: String!
  """
  2000 文字まで
  """
  memo: String! = ""
  enabled: Boolean! = true
  conditions: ProgramConditionsInput!
  settings: RecordingSettingsOverridesInput
  validFrom: Time
  validUntil: Time
  avoidDuplicates: Boolean! = false
  """
  1〜3650
  """
  duplicateWindowDays: Int
  followEventRelay: Boolean! = true
}
"""
ログイン中のユーザーの第二要素の状態 (設計書 9.3)。
"""
type SecondFactorStatus {
  """
  TOTP を登録しているかどうか。
  """
  totp: Boolean!
  """
  使っていないリカバリーコードの数。
  """
  remainingRecoveryCodes: Int!
}
"""
サービス (設計書 3.2)。
"""
type Service implements Node {
  id: ID!
  """
  ネットワーク ID
  """
  networkId: Int!
  """
  放送のサービス ID
  """
  serviceId: Int!
  name: String!
  channelType: ChannelType!
  """
  チャンネル (GR の物理チャンネルなど)
  """
  channel: String!
  remoteControlKeyId: Int
  """
  番組表に出さない印
  """
  hidden: Boolean!
}
"""
ログイン中のセッション (設計書 9.5)。どの端末かを見分け、個別に失効させるのに使う。
"""
type Session {
  id: ID!
  """
  このリクエストに使っているセッションかどうか。
  """
  current: Boolean!
  createdAt: Time!
  lastSeenAt: Time!
  userAgent: String!
  """
  ログインしたときの送信元。分からなければ null。
  """
  sourceIp: String
}
"""
保存先プール (設計書 5.6)。
"""
type StoragePool {
  id: String!
  """
  このインスタンスでのマウント先。
  """
  path: String!
  """
  選ばれる優先順位。大きいほど先に選ぶ。
  """
  priority: Int!
  """
  容量の閾値 (バイト)。空き容量がこれを下回ったら、保護されていない古い録画から消す。0 なら消さない。
  """
  minFreeBytes: Int64!
  """
  このインスタンスから見た空き容量 (バイト)。調べられなければ null。
  """
  freeBytes: Int64
}
"""
保存先プールの設定の変える項目。省いた項目は変えない。
"""
input StoragePoolInput {
  """
  -1000〜1000。
  """
  priority: Int
  """
  0 以上。0 なら、容量の管理で録画を消さない。
  """
  minFreeBytes: Int64
}
"""
外部プレイヤー (VLC や mpv) で開くための、署名付きの映像の URL (設計書 7.6、9.6)。
URL には、リソース、URL を発行したユーザー、有効期限に対する署名が付く。中身は TS をそのまま流す。
"""
type StreamURL {
  """
  パスとクエリ (例: /streams/services/3273601024?expires=...&sig=...&user=...)。オリジンは含まないので、ページのオリジンを補って使う。
  録画の URL には、署名を変えずに start (録画の始まりからの秒) を足して、再生を始める位置を指定できる。
  """
  url: String!
  """
  有効期限。既定では発行から 6 時間。
  """
  expiresAt: Time!
}
type Subscription {
  """
  接続を保つために、一定の間隔で届く今の時刻。
  """
  heartbeat: Time!
  """
  データの変更 (設計書 9.1)。購読を始めたときに、すべての種類の今の版数を送り、その後は版数が上がった種類を送る。
  どの tenban で起きた変更も届く。
  """
  dataChanged: DataChange!
  """
  ログイン中のユーザーの未読の通知の数 (設計書 6.2、9.1)。購読を始めたときに今の数を送り、その後は数が変わったときに送る。
  通知が増えたときも、ほかの端末で既読にしたときも届く。
  """
  unreadNotificationCount: Int!
  """
  ログイン中のユーザーの設定の版数 (設計書 9.1)。購読を始めたときに今の版数を送り、その後は、同じユーザーが、どの端末からでも設定を変えたときに送る。
  クライアントは、届いたら設定を読み直す。対象の設定は、通知の設定、番組表ビュー、第二要素、パスキー、セッションの失効。
  """
  viewerSettingsChanged: Int!
}
"""
画面から変える、全体の設定 (設計書 11.2)。
"""
type SystemSettings {
  """
  録画設定の全体の既定値。
  """
  recordingDefaults: RecordingSettings!
  """
  過去の番組の保持期間 (日)。0 なら無期限。
  """
  archiveRetentionDays: Int!
  """
  最後に変えた日時。一度も変えていなければ null。
  """
  updatedAt: Time
}
"""
全体の設定の変える項目。省いた項目は変えない。
"""
input SystemSettingsInput {
  """
  録画設定の既定値の変える項目。省いた項目は変えない。
  """
  recordingDefaults: RecordingSettingsOverridesInput
  archiveRetentionDays: Int
}
"""
システムの状態。
"""
type SystemStatus {
  instances: [Instance!]!
  leases: [Lease!]!
  """
  チューナーサーバーの状態。まだ確かめていなければ null。
  """
  tunerServer: TunerServerStatus
  tuners: [Tuner!]!
  pools: [StoragePool!]!
}
"""
登録中の TOTP。秘密キーは、この応答でしか見せない。
"""
type TOTPEnrollment {
  """
  認証アプリに手で入力する形の秘密キー (Base32)。
  """
  secret: String!
  """
  認証アプリが QR コードから読む otpauth URI。
  """
  uri: String!
  """
  これまでに confirmTotpEnrollment でコードを確かめないと、登録は取り消される。
  """
  expiresAt: Time!
}
"""
録画のタグ。
"""
type Tag {
  id: ID!
  name: String!
  """
  このタグが付いた録画の数。
  """
  recordings: Int!
}
"""
日時。RFC 3339 の文字列で表す。
"""
scalar Time
"""
曜日と時間帯の組。
"""
type TimeRange {
  """
  曜日の集合 (0 が日曜日、6 が土曜日)
  """
  weekdays: [Int!]!
  """
  0 時からの分で表した範囲の始まり
  """
  startMinute: Int!
  """
  範囲の長さ (分)
  """
  durationMinutes: Int!
}
"""
曜日と時間帯の組。開始時刻が範囲に入る番組に一致する。
"""
input TimeRangeInput {
  """
  曜日の集合 (0 が日曜日、6 が土曜日)
  """
  weekdays: [Int!]!
  """
  0 時からの分で表した範囲の始まり (0〜1439)
  """
  startMinute: Int!
  """
  範囲の長さ (分)。日付をまたいでよい。
  """
  durationMinutes: Int!
}
"""
時刻予約の内容。長さは 24 時間まで。
"""
input TimeReservationInput {
  service: ID!
  startAt: Time!
  endAt: Time!
  """
  画面に出す名前。200 文字まで。
  """
  name: String! = ""
  settings: RecordingSettingsOverridesInput
}
"""
チューナー (設計書 3.1)。
"""
type Tuner {
  index: Int!
  name: String!
  """
  受信できるチャンネル種別。
  """
  types: [String!]!
  available: Boolean!
  remote: Boolean!
  fault: Boolean!
}
"""
チューナーサーバーの状態 (設計書 3.7)。
"""
type TunerServerStatus {
  """
  接続できない縮退中かどうか。
  """
  degraded: Boolean!
  degradedSince: Time
  """
  最後に接続に失敗した理由。
  """
  lastError: String!
  """
  チューナーサーバーの時計と OS の時計の差 (ミリ秒)。分からなければ null。
  """
  clockSkewMs: Int
  checkedAt: Time!
}
"""
ユーザーの変える項目。省いた項目は変えない。
"""
input UpdateUserInput {
  displayName: String
  role: Role
}
"""
Webhook の変える項目。省いた項目は変えない。署名用の秘密キーは変えない。
"""
input UpdateWebhookInput {
  name: String
  url: String
  format: WebhookFormat
  kinds: [NotificationKind!]
  enabled: Boolean
}
type User implements Node {
  id: ID!
  username: String!
  displayName: String!
  role: Role!
  """
  無効にしたユーザーかどうか。無効にしたユーザーは、ログインできない。
  """
  disabled: Boolean!
  createdAt: Time!
}
"""
Web Push の購読 (設計書 6.2)。端末とブラウザごとに 1 つある。
"""
type WebPushSubscription {
  id: ID!
  """
  プッシュサービスの送り先の URL。
  """
  endpoint: String!
  """
  購読した端末の User-Agent。端末を見分けるのに使う。
  """
  userAgent: String!
  createdAt: Time!
}
"""
ブラウザの PushSubscription。PushSubscription.toJSON() の値をそのまま渡せる。
"""
input WebPushSubscriptionInput {
  endpoint: String!
  """
  ブラウザの P-256 の公開鍵を base64url にしたもの。
  """
  p256dh: String!
  """
  認証用の秘密を base64url にしたもの。
  """
  auth: String!
}
"""
管理者が設定した Webhook (設計書 6.2)。通知するイベントを、外部のサービスに送る。
"""
type Webhook {
  id: ID!
  name: String!
  """
  送り先の URL。Discord や Slack の URL は、それ自体が秘密のトークンを含む。
  """
  url: String!
  format: WebhookFormat!
  """
  送るイベントの種類。
  """
  kinds: [NotificationKind!]!
  enabled: Boolean!
  createdAt: Time!
  updatedAt: Time!
}
"""
Webhook で送る形式 (設計書 6.2)。
"""
enum WebhookFormat {
  """
  汎用の JSON
  """
  JSON
  """
  Discord の Webhook
  """
  DISCORD
  """
  Slack の Incoming Webhook
  """
  SLACK
}
