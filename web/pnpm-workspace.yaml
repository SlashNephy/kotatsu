packages:
  - vendor/mpeg2toh264/*

# Storybook が使う esbuild の postinstall は、バイナリを確かめるだけなので走らせない。
# バイナリは、プラットフォームごとの optionalDependencies から入る。
allowBuilds:
  esbuild: false

# Vite+ が同梱する vite と vitest を、依存のどこから引いても同じものにする (Vite+ の手動導入の手順)。
minimumReleaseAgeExclude:
  - aribb24.js@2.0.30

overrides:
  # web-bml は、css を GitHub の tarball で指定している。tarball の依存は pnpm が拒み、Renovate も追えないので、
  # npm の css に差し替え、tarball との差分 (パーサーの修正と、ブラウザで使えない source map の処理の削除) をパッチで当てる。
  css: 3.0.0
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vitest: 5.0.4

patchedDependencies:
  # zxcvbn-ts の l33t の照合は、読み替えの候補 (最大 100 通り) ごとに辞書を全部引き直すので、数字や記号の多い長いパスワードで遅い。
  # 候補では読み替えた文字を含む部分だけを引き、引いた結果を候補の間で使い回す。判定の結果は変わらない。
  # また、goja で辞書に順位を付け直さずに済むよう、順位を付け終えた辞書を受け取れるようにする (設計書 2.2)。
  # 辞書の照合では、辞書の語に現れない 2 文字の組が出たところで、部分文字列を伸ばすのをやめる。組はビルドのときに求めて渡す。
  '@zxcvbn-ts/core@4.2.0': patches/@zxcvbn-ts__core@4.2.0.patch
  css@3.0.0: patches/css@3.0.0.patch
  web-bml@1.0.1: patches/web-bml@1.0.1.patch
