# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# SPA を埋め込んだ kotatsu のバイナリを、GitHub Releases に公開する (設計書 11.1)。
# SPA は、goreleaser を動かす前に mise run web:build で web/dist/app に作っておく (mise run release:snapshot がまとめて行う)。
# FFmpeg、tsreadex、psisiarc は含めないので、kyusu と nekonote を動かす利用者が用意する。
version: 2

project_name: kotatsu

before:
  hooks:
    # SPA を作り忘れたまま公開しないよう、埋め込む前に確かめる。
    - test -f web/dist/app/index.html

builds:
  - id: kotatsu
    main: ./cmd/kotatsu
    binary: kotatsu
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: kotatsu
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  use: github-native

release:
  github:
    owner: SlashNephy
    name: kotatsu
