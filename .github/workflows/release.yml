name: Release

on:
  pull_request:
    # 配布の設定を変えた PR では、公開せずにビルドできるかを確かめる。
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - deploy/helm/**
      - mise.toml
      - mise.lock
  push:
    tags:
      - v*
  workflow_dispatch:

concurrency:
  # pull_request では github.ref が refs/pull/N/merge になるため head_ref でまとめる
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # 配布の設定を変えた PR などでは、公開せずに、SPA を埋め込んだバイナリを作れるかを確かめる。
  snapshot:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 公開する workflow なので、PR でもキャッシュを書かない。PR から公開のジョブにキャッシュを汚させないため。
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false
      - run: mise run release:snapshot
      - run: helm package deploy/helm/kotatsu --destination "$RUNNER_TEMP"

  # SPA を埋め込んだ linux の amd64 と arm64 のバイナリを、GitHub Releases に公開する (設計書 11.1)。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 変更履歴を前のタグから作るので、タグを含めて取得する。
          fetch-depth: 0
          persist-credentials: false
      # 公開するバイナリには、キャッシュから復元したツールを使わない。
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false
      - run: mise run //frontend:build
      # Chart は、GoReleaser がリリースに一緒に添付する (.goreleaser.yaml の release.extra_files)。
      # 公開した後のリリースには添付できない (immutable releases) ので、公開する前にそろえる。
      # 作業ツリーに置くと、GoReleaser が変更のあるツリーとみなして止まるので、外に置く。
      - name: Package the chart
        env:
          REF_NAME: ${{ github.ref_name }}
        run: helm package deploy/helm/kotatsu --version "${REF_NAME#v}" --app-version "${REF_NAME#v}" --destination "$RUNNER_TEMP/chart"
      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOTATSU_CHART_DIR: ${{ runner.temp }}/chart

  # Helm Chart を、タグの版で GitHub Pages の Helm リポジトリ (https://slashnephy.github.io/kotatsu) に公開する (設計書 11.1)。
  # Chart の本体はリリースに添付してあり、gh-pages ブランチの index.yaml からそれを指す。
  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    # リリースに添付した Chart を指すので、GoReleaser がリリースを公開し終えてから動かす。
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false
      - name: Download the chart from the release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: gh release download "$REF_NAME" --pattern 'kotatsu-*.tgz' --dir "$RUNNER_TEMP/chart"
      - name: Update the Helm repository index
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        # 生成した index.yaml は apiVersion: で始まるので、Jekyll はそのまま配る。
        # 先頭に --- を付けると front matter として読まれ、配るファイルから消えるので付けない。
        run: |
          pages="$RUNNER_TEMP/gh-pages"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          # 最初のリリースでは gh-pages ブランチがないので、空のブランチから始める。
          if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "$remote" "$pages"
          else
            git init --initial-branch gh-pages "$pages"
            git -C "$pages" remote add origin "$remote"
          fi
          merge=()
          if [ -f "$pages/index.yaml" ]; then
            merge=(--merge "$pages/index.yaml")
          fi
          helm repo index "$RUNNER_TEMP/chart" --url "https://github.com/${REPOSITORY}/releases/download/${REF_NAME}" "${merge[@]}"
          cp "$RUNNER_TEMP/chart/index.yaml" "$pages/index.yaml"
          cd "$pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.yaml
          git commit -m "chore: publish the kotatsu chart ${REF_NAME#v}"
          git push origin HEAD:gh-pages

  # 更新した index.yaml を、GitHub Pages に配信し直す。Pages はデモと一緒に pages.yml が配信する。
  pages:
    needs: chart
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
