name: Release

on:
  pull_request:
    # 配布の設定を変えた PR では、公開せずにビルドできるかを確かめる。
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - charts/**
      - mise.toml
      - mise.lock
  push:
    tags:
      - v*
  workflow_dispatch:

concurrency:
  # pull_request では github.ref が refs/pull/N/merge になるため head_ref でまとめる
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # 配布の設定を変えた PR などでは、公開せずに、SPA を埋め込んだバイナリを作れるかを確かめる。
  snapshot:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 公開する workflow なので、PR でもキャッシュを書かない。PR から公開のジョブにキャッシュを汚させないため。
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          cache: false
      - run: mise run release:snapshot
      - run: helm package charts/kotatsu --destination "$RUNNER_TEMP"

  # SPA を埋め込んだ linux の amd64 と arm64 のバイナリを、GitHub Releases に公開する (設計書 11.1)。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 変更履歴を前のタグから作るので、タグを含めて取得する。
          fetch-depth: 0
          persist-credentials: false
      # 公開するバイナリには、キャッシュから復元したツールを使わない。
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          cache: false
      - run: mise run web:build
      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Helm Chart を、タグの版で oci://ghcr.io/slashnephy/charts に公開する (設計書 11.1)。
  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          cache: false
      - env:
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${REF_NAME#v}"
          helm package charts/kotatsu --version "$version" --app-version "$version"
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "kotatsu-$version.tgz" oci://ghcr.io/slashnephy/charts
