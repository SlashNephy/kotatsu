name: Release

# タグの版で、バイナリ (GitHub Releases)、コンテナイメージ (image.yml)、Helm Chart (GitHub Pages) を公開する (設計書 11.1)。
# Tag a release (tag-release.yml) が、打ったタグでこの workflow を動かす。
# 配布の設定 (.goreleaser.yaml、Helm Chart) を変えた PR では、CI (ci.yml) の archives と deploy のジョブが、公開せずに作れるかを確かめる。
on:
  push:
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # SPA を埋め込んだ Linux、macOS、Windows の amd64 と arm64 のバイナリを、GitHub Releases に公開する (設計書 11.1)。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # id-token と attestations は、配るアーカイブと Chart に出所の証明を付けるのに使う (#1524)。
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # 変更履歴を前のタグから作るので、タグを含めて取得する。
          fetch-depth: 0
          persist-credentials: false
      # 公開するバイナリには、キャッシュから復元したツールを使わない。
      - uses: jdx/mise-action@v5.2.7
        with:
          cache: false
      - run: mise run //frontend:build
      # Chart は、GoReleaser がリリースに一緒に添付する (.goreleaser.yaml の release.extra_files)。
      # 公開した後のリリースには添付できない (immutable releases) ので、公開する前にそろえる。
      # 作業ツリーに置くと、GoReleaser が変更のあるツリーとみなして止まるので、外に置く。
      - name: Package the chart
        env:
          REF_NAME: ${{ github.ref_name }}
        run: helm package deploy/helm/kotatsu --version "${REF_NAME#v}" --app-version "${REF_NAME#v}" --destination "$RUNNER_TEMP/chart"
      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOTATSU_CHART_DIR: ${{ runner.temp }}/chart
      # 配るアーカイブと Chart に、このリポジトリのこの workflow で作ったことを示す証明 (Sigstore) を付ける (#1524、設計書 11.1)。
      # GoReleaser の OSS 版は、作る段と公開する段を分けられないので、公開の直後に付ける。証明はリリースの添付ではなく、
      # GitHub の attestation の API に置くので、immutable releases の後でも付けられる (推測)。
      - uses: actions/attest@v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ runner.temp }}/chart/*.tgz

  # 2 種類のイメージを作り、タグの版で ghcr.io に公開する (設計書 2.4)。CI と同じ手順で作る。
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/image.yml

  # Helm Chart を、タグの版で GitHub Pages の Helm リポジトリ (https://slashnephy.github.io/kotatsu) に公開する (設計書 11.1)。
  # Chart の本体はリリースに添付してあり、gh-pages ブランチの index.yaml からそれを指す。
  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    # リリースに添付した Chart を指すので、GoReleaser がリリースを公開し終えてから動かす。
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.7
        with:
          cache: false
      - name: Download the chart from the release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: gh release download "$REF_NAME" --pattern 'kotatsu-*.tgz' --dir "$RUNNER_TEMP/chart"
      # gh-pages ブランチには、GitHub App (kotatsu-artifacts) で書く (#1060)。API で作ったコミットは、App の名前で GitHub が署名する。
      - id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.KOTATSU_BOT_CLIENT_ID }}
          private-key: ${{ secrets.KOTATSU_BOT_PRIVATE_KEY }}
          # gh-pages ブランチに書く権限だけにする。
          permission-contents: write
      - name: Update the Helm repository index
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: scripts/publish-helm-index.sh "$RUNNER_TEMP/chart" "$REF_NAME"

  # 更新した index.yaml を、GitHub Pages に配信し直す。Pages はデモと一緒に pages.yml が配信する。
  pages:
    needs: chart
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
