name: Pages

# GitHub Pages (https://slashnephy.github.io/kotatsu) に、Helm リポジトリの index.yaml を配信する (設計書 11.1)。
# index.yaml は、release.yml が gh-pages ブランチに置く。リリースで更新したら、release.yml がこの workflow を呼ぶ。
# 静的なデモ (#832) は、Cloudflare Pages の Git 連携で配信するので、ここでは扱わない。
on:
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          gh api -H 'Accept: application/vnd.github.raw' "repos/$REPOSITORY/contents/index.yaml?ref=gh-pages" >"$site/index.yaml"
          ls -la "$site"
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 配信は 1 つずつにし、走っているものは止めずに最後まで出す。
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}index.yaml
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
