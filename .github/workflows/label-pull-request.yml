name: Label a pull request

# PR のタイトル (Conventional Commits) の種類から、リリースノートで分けるためのラベルを付ける (.github/release.yml)。
# タイトルを変えたら、付け直す。Renovate と Dependabot の PR は、それぞれが付けるラベルで分けるので、付けない。
on:
  # 公開リポジトリの pull_request_target は既定で止められるので、pull_request で動かす。
  # フォークからの PR ではトークンが読み取り専用になってラベルを付けられないので、ジョブを飛ばす。手で付ける。
  # 衝突している PR では pull_request が動かないので、衝突を解消した push (synchronize) でも付け直す。
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions: {}

jobs:
  label:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Label by the title
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|docs)(\([^)]*\))?!?: '
          label=
          if [[ "$TITLE" =~ $pattern ]]; then
            case "${BASH_REMATCH[1]}" in
              feat) label=enhancement ;;
              fix) label=bug ;;
              perf) label=performance ;;
              docs) label=documentation ;;
            esac
          fi
          args=()
          for other in enhancement bug performance documentation; do
            if [ "$other" != "$label" ]; then
              args+=(--remove-label "$other")
            fi
          done
          if [ -n "$label" ]; then
            args+=(--add-label "$label")
          fi
          gh pr edit "$NUMBER" --repo "$REPOSITORY" "${args[@]}"
