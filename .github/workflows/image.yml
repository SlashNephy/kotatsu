name: Image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
    inputs:
      # 急ぎのリリースで、見つけたものを承知のうえで公開するときに使う (設計書 11.1、#1922)。
      allow-vulnerabilities:
        description: Publish even if Trivy finds vulnerabilities
        type: boolean
        default: false

concurrency:
  # pull_request では github.ref が refs/pull/N/merge になるため head_ref でまとめる
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # 2 種類のイメージを amd64 と arm64 でビルドし、main とタグでは ghcr.io に公開する (設計書 2.4、11.1)。
  image:
    runs-on: ubuntu-latest
    # id-token と attestations は、公開したイメージに出所の証明を付けるのに使う (#1524)。
    # artifact-metadata は、証明をレジストリにも置く (push-to-registry) のに使う。
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    # バイナリに埋め込む版。イメージの種類の接尾辞を除くので、matrix のどちらでも同じ値になる。
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: static
            suffix: ""
          - target: ffmpeg
            suffix: -ffmpeg
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/slashnephy/kotatsu
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=edge,branch=main
            type=ref,event=pr
      # バイナリに埋め込む版。metadata-action の版には、イメージの種類の接尾辞 (-ffmpeg) が付くので、取り除く。
      # 付いたままだと、-ffmpeg のイメージだけが 2026.10.1-ffmpeg と名乗り、新しいリリースの確かめで
      # SemVer のプレリリースとして読まれる (#933)。
      - id: version
        env:
          META_VERSION: ${{ steps.meta.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
        run: echo "version=${META_VERSION%"$SUFFIX"}" >> "$GITHUB_OUTPUT"
      # 公開する前に、amd64 のイメージを読み取り専用のルートファイルシステムで起動できるかを確かめる。
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: kotatsu:smoke
          build-args: |
            VERSION=${{ steps.version.outputs.version }}+${{ github.sha }}
          # キャッシュは読むだけにする。amd64 だけのこのビルドが書くと、同じ scope の arm64 の層が消え、
          # 後の amd64 と arm64 のビルドで、QEMU で動く arm64 の層を毎回作り直すことになる。
          cache-from: type=gha,scope=${{ matrix.target }}
      # 作った直後、公開する前に、この amd64 のイメージを Trivy で確かめ、修正版のある、重さが HIGH 以上の脆弱性があれば、公開せずに失敗にする (#1922、設計書 11.1)。
      # main (edge) でもタグ (リリース) でも、push の前に止まる。PR では公開しないので、ここでは止めない。
      - if: github.event_name != 'pull_request'
        uses: jdx/mise-action@v5.2.7
        env:
          MISE_ENV: scan
        with:
          install_args: trivy
          # 公開する workflow なので、キャッシュから復元したツールを使わない。
          cache: false
      - name: Scan the image before publishing
        if: github.event_name != 'pull_request'
        env:
          MISE_ENV: scan
          ALLOW_VULNERABILITIES: ${{ inputs.allow-vulnerabilities }}
        run: scripts/ci-vulnerability-gate.sh trivy kotatsu:smoke
      - name: Smoke test
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eux
          test "$(docker inspect kotatsu:smoke -f '{{.Config.User}}')" = 65532:65532
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges kotatsu:smoke --help
          # 版とコミットを埋め込めているか。版には、イメージの種類の接尾辞を付けない (#933)。
          docker run --rm --read-only kotatsu:smoke --version | grep -F "kotatsu version $VERSION ($(echo "$GITHUB_SHA" | cut -c1-7))"
          if [ "$TARGET" = ffmpeg ]; then
            docker run --rm --read-only --entrypoint ffmpeg kotatsu:smoke -hide_banner -version
            # tsreadex は、引数がないと使い方のエラーで終わる。起動できればよい。
            docker run --rm --read-only --entrypoint sh kotatsu:smoke -c 'tsreadex 2>&1 | grep -q arguments'
            # 字幕の自動生成に使う whisper.cpp (#1682)。静的にリンクしたものが、共有ライブラリなしで起動できればよい。
            docker run --rm --read-only --entrypoint whisper-cli kotatsu:smoke --help
            docker run --rm --read-only --entrypoint whisper-vad-speech-segments kotatsu:smoke --help
            # ライセンス文書とソースの入手先 (設計書の付録 B)。
            for doc in debian-packages.tsv SOURCES tsreadex.License.txt whisper.cpp.License.txt; do
              docker run --rm --entrypoint test kotatsu:smoke -s "/usr/share/doc/kotatsu/third-party/$doc"
            done
          fi
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          # 手動で実行したときなど、付けるタグがなければ公開しない。
          push: ${{ github.event_name != 'pull_request' && steps.meta.outputs.tags != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}+${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
      # 公開したイメージに、このリポジトリのこの workflow で作ったことを示す証明 (Sigstore) を付ける (#1524、設計書 11.1)。
      # タグは後で別の digest を指しうるので、名前ではなく digest に付ける。レジストリにも置き、oci:// で確かめられるようにする。
      - if: github.event_name != 'pull_request' && steps.meta.outputs.tags != ''
        uses: actions/attest@v4.2.2
        with:
          subject-name: ghcr.io/slashnephy/kotatsu
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # PR と main への push で作ったイメージを Trivy で確かめ、重さが HIGH 以上の脆弱性があれば失敗にする (#1918、設計書 11.1)。
  # 公開済みのイメージは scan.yml で毎日確かめる。そちらは、次のリリースまで直らないので失敗にしない。
  # 必須のチェック (image (...)) とは別のジョブにして、新しく公開された脆弱性でマージを止めない。
  trivy:
    needs: image
    # タグ (リリース) では動かさない。公開したイメージは scan.yml が毎日確かめる。
    if: github.ref_type != 'tag'
    name: trivy (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_ENV: scan
    strategy:
      fail-fast: false
      matrix:
        target:
          - static
          - ffmpeg
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.7
        with:
          install_args: trivy
      - uses: docker/setup-buildx-action@v4.4.1
      # image のジョブと同じ版と同じキャッシュで、amd64 のイメージを作り直す。層はキャッシュから読むので、ほとんどビルドしない。
      # アーキテクチャで入るパッケージは変わらないので、amd64 だけを見る。
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: kotatsu:scan
          build-args: |
            VERSION=${{ needs.image.outputs.version }}+${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
      # 修正版のない脆弱性は、対処のしようがないので除く (scan.yml と同じ)。
      - name: Scan the image
        run: trivy image --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 kotatsu:scan
