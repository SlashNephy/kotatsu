name: Image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

concurrency:
  # pull_request では github.ref が refs/pull/N/merge になるため head_ref でまとめる
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # 2 種類のイメージを amd64 と arm64 でビルドし、main とタグでは ghcr.io に公開する (設計書 2.4、11.1)。
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: static
            suffix: ""
          - target: ffmpeg
            suffix: -ffmpeg
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/slashnephy/kotatsu
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=edge,branch=main
            type=ref,event=pr
      # バイナリに埋め込む版。metadata-action の版には、イメージの種類の接尾辞 (-ffmpeg) が付くので、取り除く。
      # 付いたままだと、-ffmpeg のイメージだけが 2026.10.1-ffmpeg と名乗り、新しいリリースの確かめで
      # SemVer のプレリリースとして読まれる (#933)。
      - id: version
        env:
          META_VERSION: ${{ steps.meta.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
        run: echo "version=${META_VERSION%"$SUFFIX"}" >> "$GITHUB_OUTPUT"
      # 公開する前に、amd64 のイメージを読み取り専用のルートファイルシステムで起動できるかを確かめる。
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: kotatsu:smoke
          build-args: |
            VERSION=${{ steps.version.outputs.version }}+${{ github.sha }}
          # キャッシュは読むだけにする。amd64 だけのこのビルドが書くと、同じ scope の arm64 の層が消え、
          # 後の amd64 と arm64 のビルドで、QEMU で動く arm64 の層を毎回作り直すことになる。
          cache-from: type=gha,scope=${{ matrix.target }}
      - name: Smoke test
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eux
          test "$(docker inspect kotatsu:smoke -f '{{.Config.User}}')" = 65532:65532
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges kotatsu:smoke --help
          # 版とコミットを埋め込めているか。版には、イメージの種類の接尾辞を付けない (#933)。
          docker run --rm --read-only kotatsu:smoke --version | grep -F "kotatsu version $VERSION ($(echo "$GITHUB_SHA" | cut -c1-7))"
          if [ "$TARGET" = ffmpeg ]; then
            docker run --rm --read-only --entrypoint ffmpeg kotatsu:smoke -hide_banner -version
            # tsreadex は、引数がないと使い方のエラーで終わる。起動できればよい。
            docker run --rm --read-only --entrypoint sh kotatsu:smoke -c 'tsreadex 2>&1 | grep -q arguments'
            # ライセンス文書とソースの入手先 (設計書の付録 B)。
            for doc in debian-packages.tsv SOURCES tsreadex.License.txt; do
              docker run --rm --entrypoint test kotatsu:smoke -s "/usr/share/doc/kotatsu/third-party/$doc"
            done
          fi
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          # 手動で実行したときなど、付けるタグがなければ公開しない。
          push: ${{ github.event_name != 'pull_request' && steps.meta.outputs.tags != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}+${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
