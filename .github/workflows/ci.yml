name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # pull_request では github.ref が refs/pull/N/merge になるため head_ref でまとめる
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Docker Hub は認証なしの取得に回数の上限があり、同時に何本も CI が走ると当たるので、Google のミラーから取得する。
    services:
      postgres:
        # 古いバージョンのマネージド DB でも動くよう、一つ前のメジャーバージョンで確かめる (atlas.hcl と揃える)。
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      # EPGStation からの移行で読む DB。EPGStation が対応する MySQL と MariaDB の両方で確かめる。
      mysql:
        image: mirror.gcr.io/library/mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      mariadb:
        image: mirror.gcr.io/library/mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
    env:
      KOTATSU_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      KOTATSU_TEST_EPGSTATION_MYSQL_URL: mysql://root:root@127.0.0.1:3306/
      KOTATSU_TEST_EPGSTATION_MARIADB_URL: mysql://root:root@127.0.0.1:3307/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise run build
      - run: mise run test

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise run lint
      - run: golangci-lint fmt --diff
      - run: go mod tidy -diff

  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise run generate
      # 生成物や未生成のマイグレーションがあれば、新しいファイルも含めて差分として検出する。
      - run: git add -N . && git diff --exit-code
