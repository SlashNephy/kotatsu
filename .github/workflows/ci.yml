name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # pull_request では github.ref が refs/pull/N/merge になるため head_ref でまとめる
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # PR で変わったファイルから、走らせるジョブを決める (#700)。関係のないジョブを飛ばし、ランナーの空きを待つ時間を短くする。
  # 飛ばしたジョブは「スキップ」になる (matrix のジョブは、展開せずに 1 つのスキップになる)。必須のチェックには、結果をまとめる ci のジョブだけを
  # 設定するので、飛ばしたジョブでマージは止まらない。
  # main への push と手で動かしたときは、すべて走らせる。
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go: ${{ steps.changes.outputs.go }}
      generate: ${{ steps.changes.outputs.generate }}
      web: ${{ steps.changes.outputs.web }}
      deploy: ${{ steps.changes.outputs.deploy }}
      mpeg2toh264: ${{ steps.changes.outputs.mpeg2toh264 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR では、main とのマージコミットを取り出すので、1 つ前の親 (main) との差分が PR の変更になる。
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          else
            printf 'go=true\ngenerate=true\nweb=true\ndeploy=true\nmpeg2toh264=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: test (${{ matrix.db }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # DB は、対応する最も古い版と最新の版の両方で確かめる。
    # oldest は、古いバージョンのマネージド DB や EPGStation の利用者の DB で動くことを確かめる版で、メジャーバージョンは手で上げる (atlas.hcl と揃える)。
    # latest は、Renovate が最新の版に上げる。
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: oldest
            postgres: docker.io/library/postgres:17@sha256:a63c1ea3f6a3a5a1621f97d2aba3b30faecfab4224c1b0000cc85ced57bb1939 # renovate: oldest
            mysql: docker.io/library/mysql:8.4@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364 # renovate: oldest
            mariadb: docker.io/library/mariadb:11.8@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa # renovate: oldest
          - db: latest
            postgres: docker.io/library/postgres:18@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32 # renovate: latest
            mysql: docker.io/library/mysql:26.7@sha256:625f74ddf93652d9d0f8d4ea7d741b9189554a5e96d27bb770abd0902d89c6e3 # renovate: latest
            mariadb: docker.io/library/mariadb:13.0@sha256:0e4bb0f339feba125d1154fbacd36c16ec8518f52e44e1f82ecec7d6771caf39 # renovate: latest
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      # EPGStation からの移行で読む DB。EPGStation が対応する MySQL と MariaDB の両方で確かめる。
      mysql:
        image: ${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      mariadb:
        image: ${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
    env:
      KOTATSU_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      KOTATSU_TEST_EPGSTATION_MYSQL_URL: mysql://root:root@127.0.0.1:3306/
      KOTATSU_TEST_EPGSTATION_MARIADB_URL: mysql://root:root@127.0.0.1:3307/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # mise install は、そのディレクトリの config root のツールだけを入れる。backend/ のツール (golangci-lint、sqlc、atlas) も入れるよう、backend/ で動かす。
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          working_directory: backend
      # Go のモジュールとビルドのキャッシュ。変わっていないパッケージは、ビルドもテストも、前の結果を使う。
      # backend/go.sum が変わったら作り直し、それまでは前のキャッシュから始める。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ matrix.db }}-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ matrix.db }}-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-
            go-${{ github.job }}-${{ matrix.db }}-${{ runner.os }}-
      - run: mise run build
      - run: mise run //backend:test

  # Linux 以外の配布先 (Windows、macOS) でも、DB を使わないテストを動かす (#1099)。
  # DB のサービスコンテナーは Linux のランナーでしか動かないので、DB を使うテストは飛ばす。FFmpeg と tsreadex を使うテストも、ないので飛ばす。
  test-os:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      KOTATSU_TEST_SKIP_DATABASE: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # テストには Go だけを使う。golangci-lint、sqlc、atlas は入れない。
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          working_directory: backend
          install_args: go
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-
            go-${{ github.job }}-${{ runner.os }}-
      - run: go test ./...

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          working_directory: backend
      # Go のモジュールとビルドのキャッシュ。変わっていないパッケージは、ビルドもテストも、前の結果を使う。
      # backend/go.sum が変わったら作り直し、それまでは前のキャッシュから始める。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-
            go-${{ github.job }}-${{ runner.os }}-
      - run: mise run //backend:lint
      - run: golangci-lint fmt --diff
        working-directory: backend
      - run: go mod tidy -diff
        working-directory: backend

  # Helm Chart から生成したマニフェストと、リポジトリの内容に差分がないことを確かめる (設計書 11.1)。
  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: mise run deploy:manifests
      - run: git diff --exit-code deploy/

  # ブラウザ内での変換に使う mpeg2toh264 のプレイヤーを、固定した commit とツールチェーンでビルドし直し、
  # リポジトリに置いたものと差分がないことを確かめる (設計書 7.2)。
  mpeg2toh264:
    needs: changes
    if: needs.changes.outputs.mpeg2toh264 == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_ENV: mpeg2toh264
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          working_directory: frontend
      - run: mise run //frontend:mpeg2toh264
      - run: git add -N frontend/vendor frontend/public && git diff --exit-code frontend/vendor frontend/public

  generate:
    needs: changes
    if: needs.changes.outputs.generate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          working_directory: backend
      # Go のモジュールとビルドのキャッシュ。変わっていないパッケージは、ビルドもテストも、前の結果を使う。
      # backend/go.sum が変わったら作り直し、それまでは前のキャッシュから始める。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-
            go-${{ github.job }}-${{ runner.os }}-
      # pnpm のストア。frontend/pnpm-lock.yaml が変わったら作り直す。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - run: mise run //backend:generate
      # 生成物や未生成のマイグレーションがあれば、新しいファイルも含めて差分として検出する。
      - run: git add -N . && git diff --exit-code

  # フロントエンド (設計書 10.1)。整形、lint、型検査、Vitest、Storybook のビルド、E2E テストを行う。
  # ルーティングと Relay の定義はビルドで生成するので、コミットしたものと食い違っていないかも確かめる。
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      # pnpm のストア。frontend/pnpm-lock.yaml が変わったら作り直す。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - run: mise run //frontend:check
      - run: mise run //frontend:test
      - run: mise run //frontend:storybook
      - run: mise run //frontend:build
      # デモ (#832) も、スキーマや画面の変更でビルドが通らなくなっていないかを確かめる。
      - run: mise run //frontend:demo
      - run: git add -N . && git diff --exit-code
      # Playwright のブラウザは、frontend/package.json で固定した @playwright/test の版に合わせて入れる。
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: mise run //frontend:e2e

  # 偽のチューナーサーバーと Kotatsu を立てて、主な流れを E2E で確かめる (#508、設計書 11.6)。
  # 画面と Go のどちらが変わっても流す。web のジョブと並べて走らせ、CI の待ち時間を延ばさない。
  e2e-stack:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: docker.io/library/postgres:18@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32 # renovate: latest
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kotatsu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      KOTATSU_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kotatsu?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-
            go-${{ github.job }}-${{ runner.os }}-
      - run: mise run //frontend:install
      # Playwright のブラウザは、frontend/package.json で固定した @playwright/test の版に合わせて入れる。
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: mise run e2e:stack
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-stack-traces
          path: frontend/test-results/
          retention-days: 7

  # ルールセットで必須のチェックにする、CI の結果のまとめ。Auto-merge は、このジョブが通るのを待つ。
  # 飛ばしたジョブはスキップになるので、通ったとみなす。失敗か取り消しのジョブがあれば落とす。
  ci:
    if: always()
    needs:
      - changes
      - test
      - test-os
      - lint
      - deploy
      - mpeg2toh264
      - generate
      - web
      - e2e-stack
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the results of the jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "::error::Some jobs failed or were cancelled: ${RESULTS}"
          exit 1
