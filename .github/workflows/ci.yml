name: CI

# PR と main への push で走るものを、この workflow にまとめる (#1939、設計書 11.6)。
# テスト、lint、生成物の確認、E2E、イメージ (image.yml)、CodeQL、依存の脆弱性、マニフェストの設定、スクリーンショットを確認する。
# 走らせるかどうかは changes のジョブで決め、workflow の paths では絞らない。必須のチェックは、結果をまとめる ci のジョブだけにする。
# 定期の検査 (公開済みのイメージ、毎日の依存とマニフェスト、毎週の CodeQL) は scan.yml、リリースは release.yml が動かす。
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # pull_request では github.ref が refs/pull/N/merge になるため head_ref でまとめる
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # PR で変わったファイルから、走らせるジョブを決める (#700、scripts/ci-changes.sh)。関係のないジョブを飛ばし、ランナーの空きを待つ時間を短くする。
  # 飛ばしたジョブは「スキップ」になる (matrix のジョブは、展開せずに 1 つのスキップになる)。必須のチェックには、結果をまとめる ci のジョブだけを
  # 設定するので、飛ばしたジョブでマージは止まらない。
  # main への push と手で動かしたときは、すべて走らせる。
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go: ${{ steps.changes.outputs.go }}
      generate: ${{ steps.changes.outputs.generate }}
      web: ${{ steps.changes.outputs.web }}
      deploy: ${{ steps.changes.outputs.deploy }}
      mpeg2toh264: ${{ steps.changes.outputs.mpeg2toh264 }}
      ffmpeg: ${{ steps.changes.outputs.ffmpeg }}
      image: ${{ steps.changes.outputs.image }}
      pnpm-audit: ${{ steps.changes.outputs.pnpm-audit }}
      kube-linter: ${{ steps.changes.outputs.kube-linter }}
      codeql: ${{ steps.changes.outputs.codeql }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # PR では、main とのマージコミットを取り出すので、1 つ前の親 (main) との差分が PR の変更になる。
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          else
            scripts/ci-changes.sh --all | tee -a "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: test (${{ matrix.db }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # DB は、対応する最も古いバージョンと最新のバージョンの両方で確認する。
    # oldest は、古いバージョンのマネージド DB や EPGStation の利用者の DB で動くことを確認するバージョンで、メジャーバージョンは手で上げる (atlas.hcl と揃える)。
    # latest は、Renovate が最新のバージョンに上げる。
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: oldest
            postgres: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f # renovate: oldest
            mysql: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902 # renovate: oldest
            mariadb: mariadb:11.8@sha256:d36f18d65a0459510b8b0f643b226a6d299e3206486e2b64ff20754a6d291707 # renovate: oldest
          - db: latest
            postgres: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42 # renovate: latest
            mysql: mysql:26.10@sha256:3819b2b23835c4a73c8b022fafc33c8095c0f81c929a8b7a84613d2fba6c52f5 # renovate: latest
            mariadb: mariadb:13.0@sha256:54f493ea0d60b621a5bff84e5b20100f8b86b6efa6b79158e04756c5194a5e4d # renovate: latest
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      # EPGStation からの移行で読む DB。EPGStation が対応する MySQL と MariaDB の両方で確認する。
      mysql:
        image: ${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      mariadb:
        image: ${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
    env:
      KOTATSU_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      KOTATSU_TEST_EPGSTATION_MYSQL_URL: mysql://root:root@127.0.0.1:3306/
      KOTATSU_TEST_EPGSTATION_MARIADB_URL: mysql://root:root@127.0.0.1:3307/
    steps:
      - uses: actions/checkout@v7.0.1
      # mise install は、そのディレクトリの config root のツールだけを入れる。backend/ のツール (golangci-lint、sqlc、atlas) も入れるよう、backend/ で動かす。
      - uses: jdx/mise-action@v5.2.10
        with:
          working_directory: backend
      - uses: $/.github/actions/go-cache
        with:
          name: ${{ github.job }}-${{ matrix.db }}
      - run: mise run build
      - run: mise run //backend:test

  # Linux 以外の配布先 (Windows、macOS) でも、DB を使わないテストを動かす (#1099)。
  # DB のサービスコンテナーは Linux のランナーでしか動かないので、DB を使うテストは飛ばす。FFmpeg と tsreadex を使うテストも、ないので飛ばす。
  # FFmpeg を使うテストは、smoke-os で FFmpeg を入れて流す (#1523)。
  # macOS のテストは、smoke-os の macOS のジョブの中で流す (#1691)。macOS (arm64) のランナーは空きがないと 15 分で取り消されるので、
  # 取る回数を 1 回に減らす。
  test-os:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      KOTATSU_TEST_SKIP_DATABASE: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # テストには Go だけを使う。golangci-lint、sqlc、atlas は入れない。
      - uses: jdx/mise-action@v5.2.10
        with:
          working_directory: backend
          install_args: go
      - uses: $/.github/actions/go-cache
        with:
          name: ${{ github.job }}
          extra-paths: |
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
      - run: go test ./...

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
        with:
          working_directory: backend
      - uses: $/.github/actions/go-cache
        with:
          name: ${{ github.job }}
          extra-paths: |
            ~/.cache/golangci-lint
      - run: mise run //backend:lint
      - run: golangci-lint fmt --diff
        working-directory: backend
      - run: go mod tidy -diff
        working-directory: backend

  # Helm Chart から生成したマニフェストと、リポジトリの内容に差分がないことを確認する (設計書 11.1)。
  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.10
      - run: mise run deploy:manifests
      - run: mise run deploy:test
      - run: git diff --exit-code deploy/
      # リリースで Chart を作るのと同じく、パッケージにできることを確認する。
      - run: helm package deploy/helm/kotatsu --destination "$RUNNER_TEMP"

  # ブラウザ内での変換に使う mpeg2toh264 のプレイヤーを、固定した commit とツールチェーンでビルドし直し、
  # リポジトリに置いたものと差分がないことを確認する (設計書 7.2)。
  mpeg2toh264:
    needs: changes
    if: needs.changes.outputs.mpeg2toh264 == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_ENV: mpeg2toh264
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.10
        with:
          working_directory: frontend
      - run: mise run //frontend:mpeg2toh264
      - run: git add -N frontend/vendor frontend/public && git diff --exit-code frontend/vendor frontend/public

  # ブラウザ内でデコードする経路の WASM の FFmpeg を、固定したバージョンと emscripten のイメージで組み直し、
  # リポジトリに置いたものと差分がないことを確認する (設計書 7.2、#1516)。組むのは Docker の中で行う。
  ffmpeg:
    needs: changes
    if: needs.changes.outputs.ffmpeg == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: frontend/scripts/build-ffmpeg.sh
      - run: git add -N frontend/vendor/ffmpeg frontend/public/ffmpeg && git diff --exit-code frontend/vendor/ffmpeg frontend/public/ffmpeg

  generate:
    needs: changes
    if: needs.changes.outputs.generate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
        with:
          working_directory: backend
      - uses: $/.github/actions/go-cache
        with:
          name: ${{ github.job }}
      - uses: $/.github/actions/pnpm-cache
      - run: mise run //backend:generate
      # 生成物や未生成のマイグレーションがあれば、新しいファイルも含めて差分として検出する。
      - run: git add -N . && git diff --exit-code

  # フロントエンド (設計書 10.1)。整形、lint、型検査、Vitest、Storybook のビルド、E2E テストを行う。
  # ルーティングと Relay の定義はビルドで生成するので、コミットしたものと食い違っていないかも確認する。
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - uses: $/.github/actions/pnpm-cache
      - run: mise run //frontend:check
      - run: mise run //frontend:test
      - run: mise run //frontend:storybook
      - run: mise run //frontend:build
      # デモ (#832) も、スキーマや画面の変更でビルドが通らなくなっていないかを確認する。
      - run: mise run //frontend:demo
      - run: git add -N . && git diff --exit-code
      # Playwright のブラウザは、frontend/package.json で固定した @playwright/test のバージョンに合わせて入れる。
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: mise run //frontend:e2e

  # モックのチューナーサーバーと Kotatsu を立てて、主な流れを E2E で確認する (#508、設計書 11.6)。
  # 画面と Go のどちらが変わっても流す。web のジョブと並べて走らせ、CI の待ち時間を延ばさない。
  e2e-stack:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42 # renovate: latest
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kotatsu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      KOTATSU_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kotatsu?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - uses: $/.github/actions/pnpm-cache
      - uses: $/.github/actions/go-cache
        with:
          name: ${{ github.job }}
      - run: mise run //frontend:install
      # Playwright のブラウザは、frontend/package.json で固定した @playwright/test のバージョンに合わせて入れる。
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: mise run e2e:stack
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-stack-traces
          path: frontend/test-results/
          retention-days: 7

  # 配布するアーカイブを、リリースと同じ組み方 (GoReleaser のスナップショット) で作る (#1523)。smoke-os が、Windows と macOS で開いて確認する。
  archives:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # 時間の上限は、計測した時間 (アーカイブを作るのに 6 分ほど) にゆとりを足したもの。
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.10
      - run: mise run release:snapshot
      # 埋め込んだ画面の中で、返せることを確認するファイル (字幕のフォントと、ブラウザ内での変換の WebAssembly) のパス。
      - name: List the embedded files to check
        run: |
          (cd backend/internal/web/webui/dist/app && find . -type f \( -name '*.wasm' -o -name 'rounded-mplus-1m-wadalab-mix*' \) | sed 's|^\.||' | sort) > dist/smoke-assets.txt
          test -s dist/smoke-assets.txt
          cat dist/smoke-assets.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: archives
          path: |
            dist/kotatsu_*_windows_amd64.zip
            dist/kotatsu_*_darwin_arm64.tar.gz
            dist/smoke-assets.txt
          retention-days: 3
          if-no-files-found: error

  # 配布するアーカイブを Windows と macOS のランナーで開き、バイナリが起動して、画面と埋め込んだファイルを返すことを確認する (#1523、設計書 11.6)。
  # macOS のランナーは混むと長く待たされ、空きがないと取り消されるので、まとめの ci の needs に入れず、PR を止めない。
  # 赤くなったら、その OS で壊れたということなので、見て直す。
  # macOS では、Go を変えたときに、DB を使わないテスト (test-os と同じもの) もこのジョブで流す (#1691)。
  smoke-os:
    needs: [changes, archives]
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: windows_amd64.zip
            sleep: windows
          - os: macos-latest
            archive: darwin_arm64.tar.gz
            sleep: macos
    runs-on: ${{ matrix.os }}
    # 時間の上限は、計測した時間 (ジョブは 1 分半ほど、PostgreSQL の用意は 15 秒まで、起動のステップは 20 秒ほど、macOS のテストは 3 分半ほど) に
    # ゆとりを足したもの。固まったステップで、ジョブ全体の上限を使い切らないよう、ステップごとにも上限を設ける。
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # モックのチューナーサーバーを立てるのに、Go だけを使う。
      - uses: jdx/mise-action@v5.2.10
        with:
          install_args: go
      - uses: actions/download-artifact@v8.0.2
        with:
          name: archives
          path: ${{ runner.temp }}/archives
      # Windows のランナーには、PostgreSQL が入っている (止まっている)。macOS では Homebrew で入れる。
      - name: Start PostgreSQL (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: |
          # 管理者の権限で pg_ctl を動かすと断られることがあるので、入っているサービスとして起動する。
          pwsh -NoProfile -Command 'Get-Service -Name "postgresql*" | Set-Service -StartupType Manual -PassThru | Start-Service'
          pg_bin="$(cygpath "$PGBIN")"
          for _ in $(seq 1 30); do "$pg_bin/pg_isready" -h 127.0.0.1 && break; sleep 1; done
          PGPASSWORD=root "$pg_bin/createdb" -h 127.0.0.1 -U postgres kotatsu_smoke
          echo "KOTATSU_DATABASE_URL=postgres://postgres:root@127.0.0.1:5432/kotatsu_smoke?sslmode=disable" >>"$GITHUB_ENV"
          echo "KOTATSU_SMOKE_PSQL=$pg_bin/psql" >>"$GITHUB_ENV"
      - name: Start PostgreSQL (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          brew install postgresql@17
          brew services start postgresql@17
          pg_bin="$(brew --prefix postgresql@17)/bin"
          for _ in $(seq 1 30); do "$pg_bin/pg_isready" -h 127.0.0.1 && break; sleep 1; done
          "$pg_bin/createdb" -h 127.0.0.1 kotatsu_smoke
          echo "KOTATSU_DATABASE_URL=postgres://$(whoami)@127.0.0.1:5432/kotatsu_smoke?sslmode=disable" >>"$GITHUB_ENV"
          echo "KOTATSU_SMOKE_PSQL=$pg_bin/psql" >>"$GITHUB_ENV"
      # スリープの抑止と起こす予約が OS に届き、外せることも確認する (#1522、設計書 11.7)。Windows のランナーは管理者で動き、
      # macOS では Kotatsu を sudo で動かす。どちらも、判定の間隔 (30 秒) の 3 回分まで待つステップが 4 つあるので、上限を延ばす。
      - name: Start the archive
        timeout-minutes: 10
        env:
          # 起動 (マイグレーションを含む) は、どちらのランナーでも 1 秒で済んだ。混んだランナーの揺れを見込んで、60 秒まで待つ。
          KOTATSU_SMOKE_START_TIMEOUT: "60"
          KOTATSU_SMOKE_SLEEP: ${{ matrix.sleep }}
          ARCHIVES: ${{ runner.temp }}/archives
          ARCHIVE: ${{ matrix.archive }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: scripts/ci-smoke-archive.sh "$(ls "$ARCHIVES"/kotatsu_*_"$ARCHIVE")" "$ARCHIVES/smoke-assets.txt"
      # FFmpeg を入れ、Kotatsu が FFmpeg を使う経路 (代表画像、CM の区間の見分け、録画の変換、MP4 のチャプター) のテストを流す (#1523)。
      # 配布するアーカイブには FFmpeg を同梱しないので、利用者と同じく、OS のパッケージ管理で入れたものを使う。ほかのジョブには FFmpeg がなく、
      # これらのテストは飛ぶので、ここが FFmpeg を使う経路を本物の FFmpeg で確認する唯一の場になる。必須のチェックではないので、
      # 落ちても PR を止めない。DB を使うテストは、test-os と同じく飛ばす。
      - name: Install FFmpeg
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            choco install ffmpeg --no-progress -y
            echo "C:\\ProgramData\\chocolatey\\bin" >>"$GITHUB_PATH"
          else
            brew install ffmpeg
          fi
      - name: Test the FFmpeg paths
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        working-directory: backend
        env:
          KOTATSU_TEST_SKIP_DATABASE: "1"
        run: |
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
          # 飛ばしたテストを数え、FFmpeg が見つからずに飛んだテストがあれば落とす。入れたつもりで確認していない、を防ぐ。
          go test -v ./internal/usecase/thumbnail/... ./internal/usecase/transcode/... ./internal/usecase/cmdetect/... ./internal/usecase/autocaption/... | tee "$RUNNER_TEMP/ffmpeg-tests.log"
          if grep -n "FFmpeg is not installed" "$RUNNER_TEMP/ffmpeg-tests.log"; then
            echo "::error::FFmpeg was installed but the tests could not find it"
            exit 1
          fi
      # macOS のテストは、起動を確認した後に流す。起動を確認するのに使った PostgreSQL は使わず、test-os と同じく DB を使うテストは飛ばす。
      - uses: $/.github/actions/go-cache
        if: ${{ !cancelled() && runner.os == 'macOS' && needs.changes.outputs.go == 'true' }}
        with:
          name: test-os
          extra-paths: |
            ~/Library/Caches/go-build
      - name: Test (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' && needs.changes.outputs.go == 'true' }}
        timeout-minutes: 15
        working-directory: backend
        env:
          KOTATSU_TEST_SKIP_DATABASE: "1"
        run: go test ./...

  # Docker のイメージを作り、起動と脆弱性 (Trivy) を確認する。main への push では ghcr.io に edge として公開する (image.yml)。
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/image.yml

  # CodeQL でコードを解析し、結果を Code scanning に送る。開いているアラートがあれば失敗にする (設計書 11.1、#1918)。
  # 解析する言語は、変わったファイルから決める (changes)。
  codeql:
    needs: changes
    if: needs.changes.outputs.codeql != '[]'
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.codeql) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Go は、ビルドを見て解析する。go.mod より古い Go で autobuild がバージョンを落としに行かないよう、mise で同じバージョンを入れる。
      - if: matrix.language == 'go'
        uses: jdx/mise-action@v5.2.10
        with:
          working_directory: backend
          install_args: go
      - uses: $/.github/actions/codeql
        with:
          language: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          matrix: ${{ toJSON(matrix) }}

  # Go の依存と標準ライブラリの脆弱性を govulncheck で確認し、呼び出している脆弱性があれば失敗にする (設計書 11.1、#1918)。
  # Code scanning には、定期の検査 (scan.yml) が main の結果を送る。
  govulncheck:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.10
        with:
          working_directory: backend
          install_args: go
      - uses: $/.github/actions/go-cache
        with:
          name: ${{ github.job }}
      - run: go tool govulncheck ./...

  # 画面 (frontend/) の依存に、重さが high 以上の勧告があれば失敗にする (設計書 11.1、#1918)。開発用の依存も含めて見る。
  pnpm-audit:
    needs: changes
    if: needs.changes.outputs.pnpm-audit == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.10
        with:
          install_args: node pnpm
      - run: pnpm audit --audit-level high
        working-directory: frontend

  # Helm Chart から生成したマニフェスト (all と split) の設定を kube-linter で確認し、指摘があれば失敗にする (設計書 11.1、#1918)。
  kube-linter:
    needs: changes
    if: needs.changes.outputs.kube-linter == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_ENV: scan
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.10
        with:
          install_args: aqua:stackrox/kube-linter
      - run: kube-linter lint deploy/kubernetes/all.yaml deploy/kubernetes/split.yaml

  # README のスクリーンショット (docs/screenshots) を、静的なデモから撮り直す (#621、設計書 11.6)。
  # PR では、撮れることだけを確認し、撮った画像を artifact に置く。
  # 撮影は docs/screenshots と比較し、許容差を超えて変わった画像だけを書き換える (frontend/playwright.screenshots.config.ts)。
  # main への push では、docs/screenshots と差があれば、bot が画像を差し替える PR を作り (あれば更新し)、auto-merge を有効にする。
  # GITHUB_TOKEN で作った PR では、ほかの workflow が動かず、必須のチェックが付かない。そのため、PR は GitHub App のトークンで作る。
  screenshots:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.10
      - uses: $/.github/actions/pnpm-cache
      # 日本語のフォント。撮るたびに同じ PNG になるよう、ランナーに入れたものに揃える。
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: mise run //frontend:install
      # Playwright のブラウザは、frontend/package.json で固定した @playwright/test のバージョンに合わせて入れる。
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: mise run //frontend:screenshots
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshots
          path: docs/screenshots/
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshots-traces
          path: frontend/test-results/
          retention-days: 7
      - if: github.event_name == 'push'
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.KOTATSU_BOT_CLIENT_ID }}
          private-key: ${{ secrets.KOTATSU_BOT_PRIVATE_KEY }}
          # 画像のブランチへの push と、PR の作成と auto-merge に要る権限だけにする。
          permission-contents: write
          permission-pull-requests: write
      # 差がなければ PR を作らない。開いている PR があれば閉じ、ブランチも消す。
      - if: github.event_name == 'push'
        id: pr
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bot/screenshots
          delete-branch: true
          add-paths: docs/screenshots
          sign-commits: true
          commit-message: "docs: README のスクリーンショットを撮り直す"
          title: "docs: README のスクリーンショットを撮り直す"
          body: |
            画面の変更に合わせて、README のスクリーンショット (`docs/screenshots`) を撮り直しました。
            `.github/workflows/ci.yml` の `screenshots` のジョブが、main への push のたびに作ります。必須のチェックが通ると、自動でマージします。
      - if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --merge

  # PR で足した行に、使わない語の一覧 (.yomiyasu-words/) の語がないかを確認する (#2131、docs/writing.md)。
  # yomiyasu の lint は、scripts/yomiyasu.SOURCE に固定した commit を取り出して使う。main への push では走らせない。
  words:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # PR では、main とのマージコミットを取り出すので、1 つ前の親 (main) との差分が PR の変更になる。
          fetch-depth: 2
          persist-credentials: false
      # 取り出すのは scripts/yomiyasu.SOURCE に固定した commit だけ。commit が 40 桁でなければ止める。
      # actions/checkout に動的な ref を渡さず、git fetch で commit を指して取る (CodeQL の actions/untrusted-checkout)。
      - run: |
          commit=$(sed -n 's/^commit=//p' scripts/yomiyasu.SOURCE)
          if ! printf '%s' "$commit" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error file=scripts/yomiyasu.SOURCE::commit must be a 40-character SHA"
            exit 1
          fi
          git init -q "$RUNNER_TEMP/yomiyasu"
          git -C "$RUNNER_TEMP/yomiyasu" fetch -q --depth 1 https://github.com/nanaism/yomiyasu.git "$commit"
          git -C "$RUNNER_TEMP/yomiyasu" checkout -q --detach FETCH_HEAD
          python3 scripts/check-words.py "$RUNNER_TEMP/yomiyasu/skills/yomiyasu" HEAD^1

  # workflow が使う actions が、.github/workflows/actions.lock に固定した commit と合っているかを確認する (#790)。
  # actions は、uses: にタグで書き、commit はロックファイルで固定する。Renovate が actions を上げるときに、ロックファイルも作り直す。
  actions-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=github-releases depName=github/gh-actions-lock
          GH_ACTIONS_LOCK_VERSION: v0.5.0
        run: |
          gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSION"
          gh actions-lock --verify

  # ルールセットで必須のチェックにする、CI の結果のまとめ。必須のチェックは、このジョブだけにする (#1939)。Auto-merge は、このジョブが通るのを待つ。
  # smoke-os のほかのすべてのジョブを needs に入れる。ジョブを足したら、ここにも足す。
  # 飛ばしたジョブはスキップになるので、通ったとみなす。失敗か取り消しのジョブがあれば落とす。
  ci:
    if: always()
    needs:
      - changes
      - test
      - test-os
      - lint
      - deploy
      - mpeg2toh264
      - ffmpeg
      - generate
      - web
      - e2e-stack
      - archives
      - image
      - codeql
      - govulncheck
      - pnpm-audit
      - kube-linter
      - screenshots
      - words
      - actions-lock
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the results of the jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "::error::Some jobs failed or were cancelled"
          echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"'
          exit 1
