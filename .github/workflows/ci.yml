name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # pull_request では github.ref が refs/pull/N/merge になるため head_ref でまとめる
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # PR で変わったファイルから、走らせるジョブを決める (#700)。関係のないジョブを飛ばし、ランナーの空きを待つ時間を短くする。
  # 飛ばしたジョブは「スキップ」になる (matrix のジョブは、展開せずに 1 つのスキップになる)。必須のチェックは設定していないので、マージは止まらない。
  # main への push と手で動かしたときは、すべて走らせる。
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go: ${{ steps.changes.outputs.go }}
      generate: ${{ steps.changes.outputs.generate }}
      web: ${{ steps.changes.outputs.web }}
      deploy: ${{ steps.changes.outputs.deploy }}
      mpeg2toh264: ${{ steps.changes.outputs.mpeg2toh264 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR では、main とのマージコミットを取り出すので、1 つ前の親 (main) との差分が PR の変更になる。
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          else
            printf 'go=true\ngenerate=true\nweb=true\ndeploy=true\nmpeg2toh264=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: test (${{ matrix.db }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # DB は、対応する最も古い版と最新の版の両方で確かめる。
    # oldest は、古いバージョンのマネージド DB や EPGStation の利用者の DB で動くことを確かめる版で、メジャーバージョンは手で上げる (atlas.hcl と揃える)。
    # latest は、Renovate が最新の版に上げる。
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: oldest
            postgres: mirror.gcr.io/library/postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3 # renovate: oldest
            mysql: mirror.gcr.io/library/mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70 # renovate: oldest
            mariadb: mirror.gcr.io/library/mariadb:11.8@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15 # renovate: oldest
          - db: latest
            postgres: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # renovate: latest
            mysql: mirror.gcr.io/library/mysql:26.7@sha256:893418c8a7a34c60d2d961cc30ef136095da141478562ed2101ae3f5faba9c3f # renovate: latest
            mariadb: mirror.gcr.io/library/mariadb:13.0@sha256:f1bba652ba57bea3099ca2fe1af692af537c27d96e0bcde39dce29e2ba1ec4f3 # renovate: latest
    # Docker Hub は認証なしの取得に回数の上限があり、同時に何本も CI が走ると当たるので、Google のミラーから取得する。
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      # EPGStation からの移行で読む DB。EPGStation が対応する MySQL と MariaDB の両方で確かめる。
      mysql:
        image: ${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      mariadb:
        image: ${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
    env:
      KOTATSU_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      KOTATSU_TEST_EPGSTATION_MYSQL_URL: mysql://root:root@127.0.0.1:3306/
      KOTATSU_TEST_EPGSTATION_MARIADB_URL: mysql://root:root@127.0.0.1:3307/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      # Go のモジュールとビルドのキャッシュ。変わっていないパッケージは、ビルドもテストも、前の結果を使う。
      # go.sum が変わったら作り直し、それまでは前のキャッシュから始める。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ matrix.db }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ matrix.db }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ github.job }}-${{ matrix.db }}-${{ runner.os }}-
      - run: mise run build
      - run: mise run test

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      # Go のモジュールとビルドのキャッシュ。変わっていないパッケージは、ビルドもテストも、前の結果を使う。
      # go.sum が変わったら作り直し、それまでは前のキャッシュから始める。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ github.job }}-${{ runner.os }}-
      - run: mise run lint
      - run: golangci-lint fmt --diff
      - run: go mod tidy -diff

  # Helm Chart から生成したマニフェストと、リポジトリの内容に差分がないことを確かめる (設計書 11.1)。
  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: mise run deploy:manifests
      - run: git diff --exit-code deploy/

  # ブラウザ内での変換に使う mpeg2toh264 のプレイヤーを、固定した commit とツールチェーンでビルドし直し、
  # リポジトリに置いたものと差分がないことを確かめる (設計書 7.2)。
  mpeg2toh264:
    needs: changes
    if: needs.changes.outputs.mpeg2toh264 == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_ENV: mpeg2toh264
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: mise run web:mpeg2toh264
      - run: git add -N web/vendor web/public && git diff --exit-code web/vendor web/public

  generate:
    needs: changes
    if: needs.changes.outputs.generate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      # Go のモジュールとビルドのキャッシュ。変わっていないパッケージは、ビルドもテストも、前の結果を使う。
      # go.sum が変わったら作り直し、それまでは前のキャッシュから始める。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ github.job }}-${{ runner.os }}-
      # pnpm のストア。web/pnpm-lock.yaml が変わったら作り直す。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - run: mise run generate
      # 生成物や未生成のマイグレーションがあれば、新しいファイルも含めて差分として検出する。
      - run: git add -N . && git diff --exit-code

  # フロントエンド (設計書 10.1)。整形、lint、型検査、Vitest、Storybook のビルド、E2E テストを行う。
  # ルーティングと Relay の定義はビルドで生成するので、コミットしたものと食い違っていないかも確かめる。
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      # pnpm のストア。web/pnpm-lock.yaml が変わったら作り直す。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - run: mise run web:check
      - run: mise run web:test
      - run: mise run web:storybook
      - run: mise run web:build
      - run: git add -N . && git diff --exit-code
      # Playwright のブラウザは、web/package.json で固定した @playwright/test の版に合わせて入れる。
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: mise run web:e2e
