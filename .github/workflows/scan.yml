name: Scan

# 定期の検査をまとめる (設計書 11.1、#1939)。PR と main への push での検査は CI (ci.yml) が行う。
# - 毎日: 公開したコンテナイメージと、Go と画面の依存の脆弱性、マニフェストの設定を確認する。
# - 毎週: CodeQL で main のコード全体を解析し直す。CodeQL の更新で増えたクエリを、push がなくても当てるため。
# 結果は SARIF で Code scanning に送る。直った脆弱性のアラートは、次のスキャンで閉じる。
# Code scanning の構成は analysis_key (workflow のパスとジョブの id) で分かれるので、ファイルの名前とジョブの id を変えない。
# 変えると、開いているアラートが古い構成に残り、閉じなくなる。
# Go と画面の依存とマニフェストは、見つかったらジョブを失敗にする (#1918)。
# 公開済みのイメージは、コードを修正しても次のリリースまで解消しないので、見つかっても失敗にしない。
# 失敗にするステップは、Code scanning へのアップロードの後に置く。先に落とすと、結果が送られない。
# 手で動かすと、すべてのジョブが走る。この workflow を変えた PR では、ブランチで手で動かして確認する。
on:
  schedule:
    # 毎日 6:23 (JST)。
    - cron: '23 21 * * *'
    # 毎週月曜の 4:37 (JST)。CodeQL だけを動かす。
    - cron: '37 19 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # 利用者が pull する、公開済みのイメージを Trivy で確認する。ここでビルドし直したものではなく、ghcr.io にあるものを見る。
  # 見るのは、main のイメージ (edge) と最新のリリースの、それぞれ 2 種類 (設計書 2.4)。
  # 見つかっても失敗にしない。公開済みのイメージは、コードを修正しても次のリリースまで解消せず、赤くしても対処できないため。
  image:
    if: github.event.schedule != '37 19 * * 0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      MISE_ENV: scan
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.9
        with:
          install_args: trivy
      - name: Scan images
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          release=$(gh release view --repo "$REPOSITORY" --json tagName -q .tagName)
          release=${release#v}
          mkdir -p sarif
          printf '%s\n' "edge edge" "edge-ffmpeg edge-ffmpeg" "release $release" "release-ffmpeg ${release}-ffmpeg" > sarif/targets
          # Code scanning の category は、バージョンを含めず、イメージの種類ごとに固定する。
          # バージョンを含めると、次のリリースで別の category になり、前のバージョンのアラートが閉じずに残る。
          while read -r category tag; do
            # 修正バージョンのない脆弱性は、対処のしようがないので除く。-ffmpeg のイメージでは、Debian のパッケージの 900 件近くがそうである。
            # アーキテクチャで入るパッケージは変わらないので、amd64 だけを見る。
            trivy image --quiet --platform linux/amd64 --scanners vuln --ignore-unfixed \
              --format sarif --output "sarif/$category.sarif" "ghcr.io/slashnephy/kotatsu:$tag"
            # 1 回のアップロードで複数の SARIF を送るので、category を SARIF の中に書く。
            jq --arg id "trivy/$category/" '.runs[].automationDetails.id = $id' "sarif/$category.sarif" > sarif/tmp
            mv sarif/tmp "sarif/$category.sarif"
            echo "$category ($tag): $(jq '[.runs[].results[]?] | length' "sarif/$category.sarif") results"
          done < sarif/targets
          rm sarif/targets
      - uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: sarif

  # Go の依存と標準ライブラリの脆弱性を govulncheck で確認する。呼び出しまで追うので、使っていない脆弱なコードは note に下がる。
  govulncheck:
    if: github.event.schedule != '37 19 * * 0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.9
        with:
          working_directory: backend
          install_args: go
      - name: Run govulncheck
        working-directory: backend
        run: |
          set -euo pipefail
          go tool govulncheck -format sarif ./... > ../govulncheck.sarif
          # govulncheck は、モジュール (backend/) からのパスを書く。Code scanning はリポジトリのルートからのパスとして読むので、backend/ を付ける。
          jq '(.. | objects | select(.uriBaseId? == "%SRCROOT%") | .uri) |= "backend/" + .' ../govulncheck.sarif > ../govulncheck.tmp
          mv ../govulncheck.tmp ../govulncheck.sarif
          echo "$(jq '[.runs[].results[]?] | length' ../govulncheck.sarif) results"
      - uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck
      # SARIF の形式では、見つかっても 0 で終わる。呼び出している脆弱性があれば 3 で終わる、テキストの形式で流し直す。
      # 呼び出していない脆弱性 (SARIF では note) では落とさない。
      - name: Fail on called vulnerabilities
        working-directory: backend
        run: go tool govulncheck ./...

  # 画面 (frontend/) の依存の脆弱性を pnpm audit で確認する。開発用の依存もビルドと開発で動くので、含めて見る。
  # pnpm audit は SARIF を出さないので、JSON から直して送る (.github/scan/pnpm-audit-sarif.jq)。
  pnpm-audit:
    if: github.event.schedule != '37 19 * * 0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.9
        with:
          install_args: node pnpm
      - name: Run pnpm audit
        working-directory: frontend
        run: |
          set -euo pipefail
          # 脆弱性が見つかると 0 以外で終わるので、終了コードではなく、結果の形で失敗を見分ける。
          pnpm audit --json > ../pnpm-audit.json || true
          if ! jq -e '.advisories | type == "object"' ../pnpm-audit.json > /dev/null; then
            cat ../pnpm-audit.json
            exit 1
          fi
          jq --rawfile lock pnpm-lock.yaml -f ../.github/scan/pnpm-audit-sarif.jq ../pnpm-audit.json > ../pnpm-audit.sarif
          echo "$(jq '[.runs[].results[]?] | length' ../pnpm-audit.sarif) results"
      - uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: pnpm-audit.sarif
          category: pnpm-audit
      # 重さが high 以上の勧告があれば、0 以外で終わる。
      - name: Fail on high or critical advisories
        working-directory: frontend
        run: pnpm audit --audit-level high

  # Helm Chart から生成したマニフェストの設定 (securityContext、リソースの指定、プローブなど) を kube-linter で確認する。
  # all と split の両方の構成を見る (設計書 2.4)。
  kube-linter:
    if: github.event.schedule != '37 19 * * 0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      MISE_ENV: scan
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.9
        with:
          install_args: aqua:stackrox/kube-linter
      - name: Run kube-linter
        run: |
          set -euo pipefail
          # 見つかると 1 で終わるので、終了コードではなく、結果の形で失敗を見分ける。
          kube-linter lint deploy/kubernetes/all.yaml deploy/kubernetes/split.yaml --format sarif > kube-linter.sarif || true
          if ! jq -e '.runs | type == "array"' kube-linter.sarif > /dev/null; then
            cat kube-linter.sarif
            exit 1
          fi
          echo "$(jq '[.runs[].results[]?] | length' kube-linter.sarif) results"
      - uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: kube-linter.sarif
          category: kube-linter
      # 指摘があれば 1 で終わる。指摘はテキストで出す。
      - name: Fail on findings
        run: kube-linter lint deploy/kubernetes/all.yaml deploy/kubernetes/split.yaml

  # main のコード全体を CodeQL で解析し直す。CI の codeql のジョブと同じ手順 (.github/actions/codeql) で、
  # Code scanning の構成も同じにする (analysis_key を固定する)。開いているアラートがあれば失敗にする。
  codeql:
    if: github.event.schedule != '23 21 * * *'
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          # frontend/vendor/ffmpeg と frontend/bench/wasm-decode の glue.c。
          - language: c-cpp
            build-mode: none
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          # frontend/scripts の生成用のスクリプト。
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Go は、ビルドを見て解析する。go.mod より古い Go で autobuild がバージョンを落としに行かないよう、mise で同じバージョンを入れる。
      - if: matrix.language == 'go'
        uses: jdx/mise-action@v5.2.9
        with:
          working_directory: backend
          install_args: go
      - uses: $/.github/actions/codeql
        with:
          language: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          matrix: ${{ toJSON(matrix) }}
