# Source: kotatsu/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kotatsu-kyusu
  labels:
    app.kubernetes.io/name: kotatsu
    app.kubernetes.io/instance: kotatsu
    app.kubernetes.io/version: "edge"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: kotatsu-0.0.0
    app.kubernetes.io/component: kyusu
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kotatsu
      app.kubernetes.io/instance: kotatsu
      app.kubernetes.io/component: kyusu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kotatsu
        app.kubernetes.io/instance: kotatsu
        app.kubernetes.io/version: "edge"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: kotatsu-0.0.0
        app.kubernetes.io/component: kyusu
    spec:
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: recording
      terminationGracePeriodSeconds: 30
      containers:
        - name: kotatsu
          image: ghcr.io/slashnephy/kotatsu:edge-ffmpeg
          imagePullPolicy: IfNotPresent
          args:
            - kyusu
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: KOTATSU_SERVER_LISTEN
              value: ":8080"
            - name: KOTATSU_SERVER_ADVERTISE_HOST
              value: "$(POD_IP)"
            - name: KOTATSU_METRICS_LISTEN
              value: ":9090"
            - name: KOTATSU_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kotatsu-db-app
                  key: uri
            - name: KOTATSU_AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kotatsu
                  key: secret-key
            - name: KOTATSU_STORAGE_POOLS
              value: "main=/var/lib/kotatsu/pools/main"
            - name: KOTATSU_KYUSU_WORK_DIR
              value: /var/lib/kotatsu/work
            - name: KOTATSU_KYUSU_ENCODER
              value: "vaapi"
            - name: KOTATSU_TUNER_URL
              value: "http://mirakurun:40772/"
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              gpu.intel.com/i915: 1
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: work
              mountPath: /var/lib/kotatsu/work
            - name: pool-0
              mountPath: /var/lib/kotatsu/pools/main
      volumes:
        - name: tmp
          emptyDir: {}
        - name: work
          emptyDir: {}
        - name: pool-0
          persistentVolumeClaim:
            claimName: kotatsu-recordings
      nodeSelector:
        kotatsu.example.com/gpu: "true"

