# ロールごとに Pod を分ける構成の例 (split.yaml の生成に使う)。kyusu を GPU のあるノードに置く。
mode: split
# 接続先は CloudNativePG が作る Secret から、秘密キーは別の Secret から渡す。
secrets:
  databaseURL:
    name: kotatsu-db-app
    key: uri
  secretKey:
    name: kotatsu
    key: secret-key
config:
  TUNER_URL: http://mirakurun:40772/
  KYUSU_ENCODER: vaapi
storage:
  pools:
    - id: main
      volume:
        persistentVolumeClaim:
          claimName: kotatsu-recordings
# 録画を担う mikan と、予約とチューナーの割り当てを担う neko を、ほかの Pod より先に起動させる。
roles:
  mikan:
    priorityClassName: recording
  neko:
    priorityClassName: recording
  kyusu:
    replicas: 1
    ffmpeg: true
    pools: true
    resources:
      limits:
        gpu.intel.com/i915: 1
    nodeSelector:
      kotatsu.example.com/gpu: "true"
    tolerations: []
    affinity: {}
    terminationGracePeriodSeconds: 30
