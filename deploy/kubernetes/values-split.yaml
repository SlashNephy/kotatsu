# ロールごとに Pod を分ける構成の例 (split.yaml の生成に使う)。kyusu を GPU のあるノードに置く。
mode: split
# 接続先は CloudNativePG が作る Secret から、秘密キーは別の Secret から渡す。
secrets:
  databaseURL:
    name: kotatsu-db-app
    key: uri
  secretKey:
    name: kotatsu
    key: secret-key
config:
  TUNER_URL: http://mirakurun:40772/
  KYUSU_ENCODER: vaapi
storage:
  pools:
    - id: main
      volume:
        persistentVolumeClaim:
          claimName: kotatsu-recordings
  data:
    volume:
      persistentVolumeClaim:
        claimName: kotatsu-data
# 録画を担う mikan と、予約とチューナーの割り当てを担う neko は、ノードの空きが足りないときにも先に置かれ、優先度の低い Pod を追い出して起動できるようにする。
roles:
  mikan:
    priorityClassName: kotatsu-recording
  neko:
    priorityClassName: kotatsu-recording
  kyusu:
    replicas: 1
    ffmpeg: true
    pools: true
    resources:
      limits:
        gpu.intel.com/i915: 1
    nodeSelector:
      kotatsu.example.com/gpu: "true"
    tolerations: []
    affinity: {}
    terminationGracePeriodSeconds: 30
# チューナーサーバーに EDCB を使うときは、同じ局のライブ視聴と録画でチューナーを分け合えるよう、nabe を 1 台動かす (設計書 3.1)。
# config の TUNER_URL を外して EDCB の接続先を書き、roles に nabe を足す。nabe は Mirakurun 互換のチューナーサーバーでは何もしない。
#   config:
#     TUNER_KIND: edcb
#     TUNER_EDCB_ADDRESS: edcb.example.internal:4510
#     TUNER_EDCB_BON_DRIVERS: BonDriver_LinuxPTX-T.so,BonDriver_LinuxPTX-S.so
#   roles:
#     nabe:
#       replicas: 1
