# Docker Compose で、全ロールを 1 つのコンテナで動かす例 (設計書 11.1)。
#
#   1. secret_key.txt に、32 バイト以上のランダムな文字列を書く (例: openssl rand -base64 48 > secret_key.txt)。
#      コンテナは UID 65532 で動くので、読めるようにしておく (例: chmod 644 secret_key.txt)。
#      なくすと、TOTP と Web Push の設定し直しと、Webhook の作り直しが必要になるので、バックアップする。
#      録画を置く ./recordings と、生成物を置く ./data も、UID 65532 が書けるようにしておく
#      (例: mkdir recordings data && sudo chown 65532:65532 recordings data)。
#   2. KOTATSU_TUNER_URL を、チューナーサーバー (Mirakurun、mirakc、Mahiron) の URL にする。
#   3. docker compose up -d で起動し、http://localhost:8080/ を開く。
#
# 録画は ./recordings に、索引や代表画像などの生成物は ./data に、DB は ./postgres に置く。どれもバックアップの対象になる (設計書 11.4)。
name: kotatsu

services:
  postgres:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: kotatsu
      POSTGRES_PASSWORD: kotatsu
      POSTGRES_DB: kotatsu
    volumes:
      # PostgreSQL 18 のイメージは、/var/lib/postgresql をボリュームにし、データを /var/lib/postgresql/18/docker に置く。
      # 17 までの /var/lib/postgresql/data に置くと、起動しない。
      - ./postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kotatsu"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # 起動の前に、DB のスキーマを最新にする。
  migrate:
    image: ghcr.io/slashnephy/kotatsu:edge
    command: ["migrate"]
    environment:
      KOTATSU_DATABASE_URL: postgres://kotatsu:kotatsu@postgres:5432/kotatsu?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # サムネイルの生成とサーバー側でのトランスコードに FFmpeg が要るので、-ffmpeg のイメージを使う。
  kotatsu:
    image: ghcr.io/slashnephy/kotatsu:edge-ffmpeg
    command: ["all"]
    # 止めるときは、実行中のジョブと、録画を引き継ぐまでを待つ。既定の 10 秒では、待つ間に強制終了される。
    # Helm Chart の terminationGracePeriodSeconds と同じにする。
    stop_grace_period: 5m
    environment:
      KOTATSU_DATABASE_URL: postgres://kotatsu:kotatsu@postgres:5432/kotatsu?sslmode=disable
      KOTATSU_AUTH_SECRET_KEY_FILE: /run/secrets/secret_key
      KOTATSU_TUNER_URL: http://mirakurun:40772/
      KOTATSU_STORAGE_POOLS: main=/recordings
      KOTATSU_STORAGE_DATA_DIR: /data
      KOTATSU_SERVER_LISTEN: ":8080"
    ports:
      - "8080:8080"
    volumes:
      - ./recordings:/recordings
      - ./data:/data
    tmpfs:
      - /tmp
    secrets:
      - secret_key
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

secrets:
  secret_key:
    file: ./secret_key.txt
