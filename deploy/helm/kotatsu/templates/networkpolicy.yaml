{{- /*
Pod へ届く相手を絞る NetworkPolicy (#1526、設計書 11.1)。CNI が対応していないと効かないので、既定では作らない。
Pod への Ingress を、許した相手からの、そのポートの TCP だけに絞る。Egress は絞らない。
- http (8080): all と tenban は、httpFrom の相手 (空ならどこからでも) から受ける。kyusu は、セッションを中継する tenban の Pod からだけ受ける。
  ほかのロール (neko、mikan、nekonote) は、ロールの間で HTTP を使わないので、誰からも受けない。
- metrics (9090): どのロールも、metricsFrom の相手からだけ受ける。空なら誰からも受けない。
kubelet のプローブは、Pod のあるノードからの通信として通す CNI が多い (推測)。通さない CNI では、プローブが落ちるので使わない。
*/}}
{{- if .Values.networkPolicy.enabled }}
{{- $components := list }}
{{- if eq .Values.mode "all" }}
{{- $components = list "all" }}
{{- else }}
{{- $components = keys .Values.roles | sortAlpha }}
{{- end }}
{{- range $component := $components }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-%s" (include "kotatsu.fullname" $) $component | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kotatsu.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kotatsu.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if has $component (list "all" "tenban") }}
    - ports:
        - protocol: TCP
          port: http
      {{- with $.Values.networkPolicy.httpFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- else if eq $component "kyusu" }}
    - ports:
        - protocol: TCP
          port: http
      from:
        - podSelector:
            matchLabels:
              {{- include "kotatsu.selectorLabels" (dict "root" $ "component" "tenban") | nindent 14 }}
    {{- end }}
    {{- with $.Values.networkPolicy.metricsFrom }}
    - ports:
        - protocol: TCP
          port: metrics
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
{{- end }}
