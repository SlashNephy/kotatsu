{{- /*
Gateway API の HTTPRoute (#1526、設計書 11.1)。Ingress の API は機能が凍結されているので、Gateway でも公開できるようにする。
API サーバーが既定値を入れる項目 (parentRefs と backendRefs の group、kind、backendRefs の weight) は、省略されても書き出す。
書かないと、マニフェストとクラスターにあるものが食い違い、GitOps の ServerSideApply で OutOfSync が続く。
証明書は Gateway のリスナーが持つので、ここには書かない。
*/}}
{{- with .Values.httpRoute }}
{{- if .enabled }}
{{- if not .parentRefs }}
{{- fail "httpRoute.parentRefs is required when httpRoute.enabled is true; an HTTPRoute has no listener of its own" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kotatsu.fullname" $ }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kotatsu.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range .parentRefs }}
    - group: {{ .group | default "gateway.networking.k8s.io" }}
      kind: {{ .kind | default "Gateway" }}
      name: {{ required "httpRoute.parentRefs[].name is required" .name }}
      {{- with .namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . }}
      {{- end }}
      {{- with .port }}
      port: {{ . }}
      {{- end }}
    {{- end }}
  hostnames:
    {{- range (.hostnames | default (list $.Values.ingress.host)) }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "kotatsu.fullname" $ }}
          port: {{ $.Values.service.port }}
          weight: 1
      {{- /* ライブ視聴と SSE は長く続くので、既定では、時間の上限を実装の既定に任せる。 */}}
      {{- with .timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
