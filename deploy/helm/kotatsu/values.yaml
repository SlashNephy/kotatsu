# Kotatsu の Helm Chart の設定 (設計書 11.1)。
# PostgreSQL は Chart に含めないので、外部のもの (CloudNativePG など) を用意して、接続先を Secret で渡す。

# mode は、全ロールを 1 つの Pod で動かす all か、ロールごとに Pod を分ける split のどちらか。
mode: all

image:
  repository: ghcr.io/slashnephy/kotatsu
  # tag が空なら、Chart の appVersion を使う。
  tag: ""
  # digest は、FFmpeg を含まないイメージの digest (sha256:...)。指定すると、タグに加えて digest で固定する。
  digest: ""
  # ffmpegDigest は、-ffmpeg のイメージの digest。digest とは別のイメージなので、別に指定する。
  ffmpegDigest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# secrets は、Kotatsu に渡す秘密情報を持つ Secret とキー。Chart は Secret を作らないので、先に作っておく。
# 項目ごとに Secret を分けられる。たとえば、接続先は CloudNativePG が作る Secret から、秘密キーは別の Secret から渡せる。
secrets:
  # databaseURL は、PostgreSQL の接続先 (postgres://...)。
  databaseURL:
    name: kotatsu
    key: database-url
  # secretKey は、アプリの秘密キー (32 バイト以上)。なくすと、TOTP と Web Push の設定し直しと、Webhook の作り直しが必要になる。
  secretKey:
    name: kotatsu
    key: secret-key
  # tunerURL は、チューナーサーバーの URL。BASIC 認証の資格情報を URL に含めるときは、こちらで渡す。
  # name が空なら渡さない。config.TUNER_URL と両方には書けない。
  tunerURL:
    name: ""
    key: tuner-url
  # oidcClientSecret は、OIDC のクライアントシークレット。name が空なら渡さない。
  # config.AUTH_OIDC_CLIENT_SECRET と両方には書けない。
  oidcClientSecret:
    name: ""
    key: oidc-client-secret

# automountServiceAccountToken は、Pod に ServiceAccount のトークンを渡すかどうか。Kotatsu は Kubernetes の API を使わないので、既定では渡さない。
automountServiceAccountToken: false

# serviceAccountName は、すべての Deployment の Pod が使う ServiceAccount。Chart は ServiceAccount を作らないので、先に作っておく。
# 空なら namespace の default を使う。all や roles の各ロールで serviceAccountName を指定すると、そちらを使う。
# ロールの指定を空にすると全体の指定を使うので、全体を指定したうえで一部のロールだけ戻すときは、default と書く。
# Pod にサイドカーを注入する仕組みが、サイドカーに渡す権限を ServiceAccount で決めるときなどに使う。
# マイグレーションの Job には付けない。Job は install と upgrade の前に (Argo CD では PreSync で) 走るので、
# 同じ構成で作る ServiceAccount より先に走ると Pod を作れないからである。Job には要らない権限を持たせないためでもある。
serviceAccountName: ""

# podAnnotations と podLabels は、すべての Deployment の Pod に足す annotation とラベル。
# all や roles の各ロールの podAnnotations と podLabels を、キーごとに重ねる。同じキーは、ロールのほうを使う。
# Chart が付けるラベル (app.kubernetes.io/name、instance、version、managed-by、component と helm.sh/chart) は、
# selector と食い違わないよう、podLabels に書くと描画を止める。
# マイグレーションの Job には付けない。サイドカーを注入するラベルが Job に付くと、サイドカーが終わらず Job が完了しないからである。
# 例 (サイドカーをラベルで注入し、ロールごとに名前を annotation で渡す):
#   podLabels:
#     sidecar.example.com/inject: "true"
#   podAnnotations:
#     sidecar.example.com/apikey-secret-name: sidecar-api-key
#   roles:
#     tenban:
#       podAnnotations:
#         sidecar.example.com/roles: kotatsu:tenban
podAnnotations: {}
podLabels: {}

# probes は、すべてのコンテナの liveness と readiness のプローブの設定 (Kubernetes の Probe のうち、httpGet のほか)。
# all や roles の各ロールの probes で、項目ごとに上書きできる。CPU が飽和しがちなノードでは、timeoutSeconds を延ばす。
# 例:
#   probes:
#     liveness:
#       timeoutSeconds: 5
#       periodSeconds: 30
#       failureThreshold: 4
#     readiness:
#       timeoutSeconds: 5
# readiness の initialDelaySeconds は、コンテナの起動直後に最初のプローブが届き、HTTP サーバーが待ち受ける前で
# connection refused になって Unhealthy のイベントが出るのを避ける。サーバーは起動から 1 秒もかからず待ち受ける。
probes:
  liveness: {}
  readiness:
    initialDelaySeconds: 2

# priorityClassName は、すべての Pod に付ける PriorityClass。all や roles の各ロールで priorityClassName を指定すると、そちらを使う。
priorityClassName: ""

# extraEnv と extraEnvFrom は、すべてのコンテナに足す環境変数 (Kubernetes の env と envFrom の形)。
# secrets にない秘密の設定を、Secret から渡すのに使う。
# 例:
#   extraEnv:
#     - name: KOTATSU_WEBPUSH_SUBJECT
#       valueFrom:
#         secretKeyRef:
#           name: kotatsu
#           key: webpush-subject
extraEnv: []
extraEnvFrom: []

# config は、環境変数で渡す Kotatsu の設定 (KOTATSU_ の後ろの名前と値)。
# 例: {TUNER_URL: http://mirakurun:40772/, SERVER_ALLOWED_PRIVATE_NETWORKS: "10.0.0.0/8,192.168.0.0/16"}
config: {}

# storage.pools は、録画の保存先プール。どのプールも、録画を書く mikan、読む tenban と kyusu、解析する nekonote にマウントする。
# volume は、Pod の volume の定義 (persistentVolumeClaim や nfs など)。
# 例:
#   - id: main
#     volume:
#       persistentVolumeClaim:
#         claimName: kotatsu-recordings
# hostPath で渡すときは、ディスクのマウントポイントそのものでなく、その中のディレクトリを path にし、type: Directory にする (設計書 5.6)。
# マウントされていないときに、空のマウントポイントを測ったり、そこに録画を書いたりしないためである。
# storage.data は、録画の生成物 (索引、代表画像、プレビュー画像) を、セグメントのファイルの ID ごとに置く volume (設計書 5.6)。
# プールを設定するなら必ず要る。プールと同じロールにマウントする。
# 例:
#   volume:
#     persistentVolumeClaim:
#       claimName: kotatsu-data
# storage.timeshift は、タイムシフトのバッファ (放送を一定時間だけ残すチャンクのファイル) を置く volume (設計書 5.7)。
# 設定しなければ、タイムシフトは動かない。設定するなら storage.data も要る。プールと同じロールにマウントする。
# 例:
#   volume:
#     persistentVolumeClaim:
#       claimName: kotatsu-timeshift
storage:
  pools: []
  data: {}
  timeshift: {}

# backup.volume は、nekonote が定期のバックアップを書き出す volume (設計書 11.4、#1926)。
# 設定すると、all か nekonote にマウントし、KOTATSU_BACKUP_DIR を渡す。暗号化する公開鍵と間隔と残す世代の数は、管理者の画面で決める。
# 書き出したファイルは、rclone などで外へ写す (docs/operations.md)。プールやデータディレクトリとは別の volume にする。
# 例:
#   volume:
#     persistentVolumeClaim:
#       claimName: kotatsu-backups
backup:
  volume: {}

# podSecurityContext と securityContext は、すべての Pod とコンテナに付ける。既定値は堅くしてあり、そのまま使える。
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: kotatsu.example.com
  tls: []
  # trustedProxies は、X-Forwarded-For を信頼する Ingress のコントローラーのネットワーク (CIDR か IP アドレス)。
  # KOTATSU_SERVER_TRUSTED_PROXIES として渡す。Ingress を使うなら必須で、空だと Ingress を通る全リクエストが 400 になる。
  # 普通は、コントローラーの Pod が使う Pod のネットワークの CIDR を書く。例: ["10.244.0.0/16"]
  # コントローラーの前で送信元のアドレスが書き換わる (SNAT) と、送信元がノードのアドレスに見え、接続元の制限が効かない。
  # コントローラーの Service を externalTrafficPolicy: Local にするなどして、送信元を保つ。
  trustedProxies: []

# httpRoute は、Gateway API の HTTPRoute で公開する設定 (#1526)。Gateway API の CRD (gateway.networking.k8s.io/v1) が要る。
# X-Forwarded-For を信頼させる必要があるので、ingress.trustedProxies (Gateway の Pod のネットワーク) も必須にする。
httpRoute:
  enabled: false
  annotations: {}
  # parentRefs は、ルートを付ける Gateway。必須。各項目の name は必須で、namespace、sectionName (リスナー名)、port は任意。
  # group と kind は、省略すると gateway.networking.k8s.io と Gateway になる (書き出しは省略しない)。
  # ホスト名の段数ごとにリスナーが分かれる構成では、sectionName ごとに項目を分けて書く。
  # 例: [{name: shared-gateway, namespace: gateway, sectionName: https}]
  parentRefs: []
  # hostnames が空なら、ingress.host を使う。
  hostnames: []
  # timeouts は、ルールの timeouts (request、backendRequest)。空なら Gateway の実装の既定に任せる。
  # ライブ視聴と SSE は長く続くので、短い上限を設ける実装では、長く取る。
  timeouts: {}

# networkPolicy は、Pod へ届く相手を絞る NetworkPolicy (#1526)。CNI が対応していないと効かないので、既定では作らない。
# 作ると、Pod への Ingress を、許した相手からの、そのポートの TCP だけに絞る。Egress は絞らない。
# all と tenban の http は httpFrom から、kyusu の http は tenban の Pod から、nabe の http は tenban、mikan、kyusu の Pod から、
# どのロールの metrics も metricsFrom から受ける。
# neko、mikan、nekonote の http は誰からも受けない (kubelet のプローブは、ノードからの通信として通す CNI が多い)。
networkPolicy:
  enabled: false
  # httpFrom は、all と tenban の http (8080 番) を受ける相手 (NetworkPolicyPeer の並び)。空ならどこからでも受ける。
  # 例: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}]
  httpFrom: []
  # metricsFrom は、metrics (9090 番) を受ける相手。空なら誰からも受けない。
  # 例: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]
  metricsFrom: []

# metrics は、/metrics の scrape の設定 (設計書 11.3)。どのロールの Pod も、metrics のポート (9090 番) で待ち受ける。
metrics:
  # podMonitor は、Prometheus Operator の PodMonitor。CRD (monitoring.coreos.com/v1) のないクラスターでは作れないので、既定では作らない。
  # 全ロールの Pod を読み、Pod の component (all か、ロールの名前) を role のラベルにする。
  podMonitor:
    enabled: false
    # labels は、PodMonitor に足すラベル。Prometheus の podMonitorSelector に合わせる。例: {release: kube-prometheus-stack}
    labels: {}
    # interval と scrapeTimeout が空なら、Prometheus の既定を使う。例: 30s
    interval: ""
    scrapeTimeout: ""
    # relabelings と metricRelabelings は、Prometheus Operator の RelabelConfig の形。relabelings は、role のラベルの後に足す。
    relabelings: []
    metricRelabelings: []
  # otlp は、メトリクスを OTLP で送る設定 (KOTATSU_TELEMETRY_OTLP_METRICS_*)。endpoint が空なら送らない。
  # 空の項目は渡さず、Kotatsu の既定値 (protocol は grpc、intervalSeconds は 60) を使う。
  # DB から読む値は、neko のリースを持つ Pod だけが送り、Pod の ID を付けない。ほかの値は、各 Pod が Pod の ID とロールを付けて送る。
  # 例 (Mackerel に直接送る):
  #   otlp:
  #     endpoint: https://otlp.mackerelio.com:4317
  #     headers: {name: mackerel, key: headers}   # 中身は Mackerel-Api-Key=<書き込みのできる API キー>
  #     exclude: [go_*, process_*]                 # 系列を減らしたいときだけ
  otlp:
    endpoint: ""
    # protocol は、grpc か http/protobuf。
    protocol: ""
    intervalSeconds: 0
    # exclude は、送らないメトリクスの名前のパターン (Go の path.Match の形)。/metrics には影響しない。
    exclude: []
    # headers は、送るたびに付けるヘッダー (名前=値 をカンマでつないだもの) を持つ Secret とキー。name が空なら渡さない。
    headers:
      name: ""
      key: headers

# migration は、install と upgrade の前に kotatsu migrate を実行する Job (設計書 11.4)。
migration:
  enabled: true
  # resources は、マイグレーションの Job のコンテナのリソース。SQL を順に流すだけなので、小さくする。
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi
  # ttlSecondsAfterFinished は、終わった Job を消すまでの秒。成功した Job はフックの設定ですぐ消えるので、
  # 主に失敗した Job に効く。失敗のログを読めるよう、1 日残す。0 ならすぐ消し、null なら消さない。
  ttlSecondsAfterFinished: 86400

# all は、mode が all のときの Pod の設定。FFmpeg が要るので、-ffmpeg のイメージを使う。
all:
  # resources は、全ロールを動かすコンテナのリソース。録画の変換、字幕の自動生成、ライブ視聴の変換の FFmpeg と whisper-cli も
  # この中で動くので、limits を広めに取る。値の決め方は roles の前の説明を参照。
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 8Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # runtimeClassName は、Pod を動かすランタイム。GPU を使うとき、NVIDIA のランタイムが既定でないクラスター (k3s など) では、
  # その RuntimeClass の名前 (例: nvidia) を入れる。空なら既定のランタイムを使う。
  runtimeClassName: ""
  probes: {}
  # preStopSleepSeconds は、止める前に、Service から外れるのを待つ秒 (preStop の sleep)。0 なら待たない。
  # 外れる前に止まり始めると、止まりかけの tenban に新しい接続が来る (設計書 11.4、#1085)。
  preStopSleepSeconds: 5
  # terminationGracePeriodSeconds は、mikan が録画を引き継ぐまで待つ時間を含める。
  terminationGracePeriodSeconds: 300
  # workSizeLimit は、kyusu が HLS のセグメントを置く作業ディレクトリ (emptyDir) の容量の上限。空なら上限を付けない。
  # 超えると kubelet が Pod を退避させるので、同時に開くセッションの数と画質に見合う量にする。
  workSizeLimit: ""

# roles は、mode が split のときの、ロールごとの Pod の設定。
# resources は、ロールごとのコンテナのリソース。requests は、本番の split の構成で使っている値 (待機しているときの
# プロセスのメモリは、全ロールを合わせて 100 MB 未満) に寄せる。limits の memory は、漏れたときに OOMKill で止まるよう、余裕を持たせて付ける。
# FFmpeg と whisper-cli を動かす nekonote と kyusu は、実測がないので広めに取る。CPU の limits は、処理を詰まらせないよう付けない。
# Helm は values の map を深くマージするので、resources: {} と書いても既定値は消えない。項目を外すときは、memory: null のように null を書く。
# affinity が空で、replicas が 2 以上のロールには、同じロールの Pod をなるべく別のノードに置く podAntiAffinity (preferred) を付ける。
# 置ける先が 1 つなら、同じノードに置く。affinity を書いたときは付けないので、要るなら一緒に書く。
# ffmpeg が true のロールは、-ffmpeg のイメージを使う。pools が true のロールには、録画の保存先プールをマウントする。
roles:
  tenban:
    replicas: 2
    ffmpeg: false
    pools: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 1Gi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    runtimeClassName: ""
    probes: {}
    # preStopSleepSeconds は、止める前に、Service から外れるのを待つ秒 (preStop の sleep)。0 なら待たない。
    # 外れる前に止まり始めると、止まりかけの tenban に新しい接続が来る (設計書 11.4、#1085)。
    preStopSleepSeconds: 5
    # terminationGracePeriodSeconds は、preStop の待ち (5 秒)、視聴者がつなぎ直すのを待つ時間 (20 秒)、
    # 処理中のリクエストを待つ時間 (20 秒) を足した長さに、余裕を持たせる。
    terminationGracePeriodSeconds: 60
  neko:
    # neko は、リースを持つ 1 つだけが動くので、増やしても待機になる。
    replicas: 1
    ffmpeg: false
    pools: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 512Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    runtimeClassName: ""
    probes: {}
    terminationGracePeriodSeconds: 30
  mikan:
    # mikan を 2 つ以上にすると、更新の間も録画が途切れない (設計書 5.4)。
    replicas: 2
    ffmpeg: false
    pools: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 1Gi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    runtimeClassName: ""
    probes: {}
    # 終了のシグナルを受けてから、別の mikan が録画を引き継ぐまで待つ。
    terminationGracePeriodSeconds: 300
    podDisruptionBudget:
      maxUnavailable: 1
      # unhealthyPodEvictionPolicy は、ready でない mikan を退避させてよいか。IfHealthyBudget では、ready の mikan が
      # 足りないとき (止まっている数が maxUnavailable に達しているとき) は、ready でない mikan も退避させない。
      # mikan は DB に 5 分届かないと ready でなくなるが、その間も録画を続けるので、AlwaysAllow にはしない (設計書 11.3)。
      unhealthyPodEvictionPolicy: IfHealthyBudget
  nekonote:
    replicas: 1
    ffmpeg: true
    pools: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 4Gi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    runtimeClassName: ""
    probes: {}
    terminationGracePeriodSeconds: 60
  kyusu:
    # kyusu はサーバー側でのトランスコードで、なくても動く。GPU のあるノードに置くときは nodeSelector と resources を使い、
    # NVIDIA のランタイムが既定でないクラスターでは runtimeClassName も入れる (all の runtimeClassName を参照)。
    replicas: 0
    # workSizeLimit は、HLS のセグメントを置く作業ディレクトリ (emptyDir) の容量の上限。空なら上限を付けない。
    # 超えると kubelet が Pod を退避させるので、同時に開くセッションの数と画質に見合う量にする。
    workSizeLimit: ""
    ffmpeg: true
    pools: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 4Gi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    runtimeClassName: ""
    probes: {}
    terminationGracePeriodSeconds: 30
  nabe:
    # nabe は、EDCB の NetworkTV の TS をサービスごとに 1 本開いて、tenban、mikan、kyusu に配る (設計書 3.1、#1535)。
    # EDCB を使う (config.TUNER_KIND が edcb の) ときだけ意味があり、Mirakurun 互換のチューナーサーバーでは何もしない。
    # 使うときは 2 にする (#1850)。2 台の nabe は、同じサービスに同じ NetworkTV の ID を使い、チューナーを増やさない。
    # 1 台が止まっても、受け手はもう 1 台につなぎ直し、同じチューナーの TS を受け取り続ける。1 でも動くが、止まると受け手が自分で開き直す。
    # 2 台は、なるべく別のノードに置く (roles の前の説明を参照)。必ず別のノードに置くときは、affinity で分ける。3 台以上にしても、1 つの NetworkTV を受け取れるのは 2 台までなので、冗長にはならない。
    # ほかのロールは、インスタンスの登録簿で nabe の Pod の IP を引いてつなぐので、Service は要らない。
    # nabe と、受け取るロールには、同じアプリの秘密キー (secrets.secretKey) が要る。Chart は全ロールに同じものを渡す。
    replicas: 0
    ffmpeg: false
    pools: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 1Gi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    runtimeClassName: ""
    probes: {}
    # 止めるときは、流しているストリームを打ち切り、受け手がもう 1 台の nabe に移るのを数秒待ってから NetworkTV を閉じて止まる。
    terminationGracePeriodSeconds: 30
