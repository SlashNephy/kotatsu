---
# Source: kotatsu/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kotatsu-all
  namespace: default
  labels:
    app.kubernetes.io/name: kotatsu
    app.kubernetes.io/instance: kotatsu
    app.kubernetes.io/version: "edge"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: kotatsu-0.0.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kotatsu
      app.kubernetes.io/instance: kotatsu
      app.kubernetes.io/component: all
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: http


