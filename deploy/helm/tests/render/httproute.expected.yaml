---
# Source: kotatsu/templates/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kotatsu
  namespace: default
  labels:
    app.kubernetes.io/name: kotatsu
    app.kubernetes.io/instance: kotatsu
    app.kubernetes.io/version: "edge"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: kotatsu-0.0.0
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - "kotatsu.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kotatsu
          port: 80
          weight: 1

