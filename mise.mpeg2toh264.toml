# mpeg2toh264 のプレイヤーをソースからビルドするときだけ使うツールチェーン (設計書 7.2)。
# ほかの作業で Rust を入れずに済むよう、MISE_ENV=mpeg2toh264 のときだけ読む。
#
#   MISE_ENV=mpeg2toh264 mise run web:mpeg2toh264
[tools]
rust = { version = "1.98.1", targets = "wasm32-unknown-unknown", profile = "minimal" }
# mpeg2toh264 の Cargo.lock の wasm-bindgen と同じ版にする。違うと、生成した glue が読めない。
"github:wasm-bindgen/wasm-bindgen" = "0.2.126"
