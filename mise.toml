# ツールとタスクは、プロジェクトごとに backend/ と frontend/ の mise.toml に分ける。
# ほかのプロジェクトのタスクは mise run //backend:test のように、ルートのタスクは mise run build のように呼ぶ。
monorepo_root = true

[monorepo]
config_roots = ["backend", "frontend"]

# mise は、タスクを定義した config root のツールしか解決しない。ルートのタスクが使うツールは、ここに書く。
# ルートのツールは、backend/ と frontend/ も引き継ぐ。
[tools]
# go.work の持ち主はルート。ルートのタスク (build、e2e:stack、release:snapshot) がバイナリを作るのに使う。
go = "1.27.3"
# バイナリを GitHub Releases に公開する (設計書 11.1)。
goreleaser = "2.19.0"
# Helm Chart から Kubernetes のマニフェストを生成する (設計書 11.1)。
helm = "4.3.1"
# フロントエンドのツールチェーン。frontend/ はここから引き継ぐ。Vite+ は frontend/package.json の devDependency にする (設計書 10.1)。
node = "26.13.0"
pnpm = "12.16.0"

# 開発用の Compose を、ソースの変更を見てビルドし直す構成で動かす (docs/development.md)。
# コンテナの中で生成したファイルが手元のユーザーの持ち物になるよう、UID と GID を渡す。
[tasks.dev]
run = "DEV_UID=$(id -u) DEV_GID=$(id -g) docker compose up --build"

# 埋め込んだバイナリを作るときは、mise run //frontend:build の後に実行する。
[tasks.build]
run = "go build -trimpath -o ./bin/ ./backend/cmd/kotatsu"

# Helm Chart から、全ロールを 1 つの Pod で動かす構成と、ロールを分けた構成のマニフェストを生成する (設計書 11.1)。
# 生成したものとリポジトリの内容に差分がないことを、CI で確かめる。
[tasks."deploy:manifests"]
run = [
  "helm lint deploy/helm/kotatsu",
  "helm template kotatsu deploy/helm/kotatsu -f deploy/kubernetes/values-all.yaml > deploy/kubernetes/all.yaml",
  "helm template kotatsu deploy/helm/kotatsu -f deploy/kubernetes/values-split.yaml > deploy/kubernetes/split.yaml",
]

# SPA を埋め込んだバイナリを、公開せずに作る。作ったものは dist/ に置く。
[tasks."release:snapshot"]
depends = ["//frontend:build"]
run = "goreleaser release --snapshot --clean"

# 偽のチューナーサーバーと Kotatsu を立てて、初回セットアップ、ルール、ライブ視聴の流れを E2E で確かめる (#508)。
# KOTATSU_DATABASE_URL に、空の DB を渡す。
[tasks."e2e:stack"]
# 画面を埋め込むので、Kotatsu は //frontend:build の後にビルドする。depends に並べると、同時に走ってしまう。
depends = ["//frontend:build"]
run = ["go build -trimpath -o ./bin/ ./backend/cmd/kotatsu", "scripts/e2e-stack.sh"]
