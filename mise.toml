[tools]
golangci-lint = "2.14.0" # go より先に置かないと、go/bin/ のバイナリが優先されてしまう
go = "1.27.2"
atlas-community = "1.3.0"
sqlc = "1.31.1"
# バイナリを GitHub Releases に公開する (設計書 11.1)。
goreleaser = "2.18.3"
# Helm Chart から Kubernetes のマニフェストを生成する (設計書 11.1)。
helm = "4.3.0"
# フロントエンド (web/) のツールチェーン。Vite+ は web/package.json の devDependency にする (設計書 10.1)。
node = "24.21.0"
pnpm = "12.13.0"

# 開発用の Compose を、ソースの変更を見てビルドし直す構成で動かす (docs/development.md)。
# コンテナの中で生成したファイルが手元のユーザーの持ち物になるよう、UID と GID を渡す。
[tasks.dev]
run = "DEV_UID=$(id -u) DEV_GID=$(id -g) docker compose up --build"

[tasks.build]
run = "go build -trimpath -o ./bin/ ./cmd/kotatsu"

# Helm Chart から、全ロールを 1 つの Pod で動かす構成と、ロールを分けた構成のマニフェストを生成する (設計書 11.1)。
# 生成したものとリポジトリの内容に差分がないことを、CI で確かめる。
[tasks."deploy:manifests"]
run = [
  "helm lint charts/kotatsu",
  "helm template kotatsu charts/kotatsu -f deploy/kubernetes/values-all.yaml > deploy/kubernetes/all.yaml",
  "helm template kotatsu charts/kotatsu -f deploy/kubernetes/values-split.yaml > deploy/kubernetes/split.yaml",
]

# SPA を埋め込んだバイナリを、公開せずに作る。作ったものは dist/ に置く。
[tasks."release:snapshot"]
depends = ["web:build"]
run = "goreleaser release --snapshot --clean"

# フロントエンド (web/)。ビルドした SPA は web/dist/app に出力され、go build で埋め込まれる。
# 埋め込んだバイナリを作るときは、mise run web:build の後に mise run build を実行する。
[tasks."web:install"]
dir = "web"
run = [
  "pnpm install --frozen-lockfile",
  # 字幕を描くフォントは npm にないので、web/vendor/caption-font/SOURCE で固定したリリースから取得する。
  "node scripts/fetch-caption-font.mjs",
]

# ブラウザ内での変換に使う mpeg2toh264 のプレイヤーを、web/vendor/mpeg2toh264/SOURCE の commit からビルドし直す (設計書 7.2)。
# Rust と wasm-bindgen は mise.mpeg2toh264.toml で固定しているので、MISE_ENV=mpeg2toh264 を付けて実行する。
[tasks."web:mpeg2toh264"]
run = "./scripts/build-mpeg2toh264.sh"

# GraphQL のクエリから、Relay の型とアーティファクト (__generated__) を生成する。
# watchman があれば使おうとするが、使わなくても足りるので切る。
[tasks."web:relay"]
dir = "web"
depends = ["web:install"]
env = { FORCE_NO_WATCHMAN = "1" }
run = "pnpm exec relay-compiler"

[tasks."web:build"]
dir = "web"
depends = ["web:relay"]
run = "pnpm exec vp build"

[tasks."web:check"]
dir = "web"
depends = ["web:relay"]
run = "pnpm exec vp check"

[tasks."web:test"]
dir = "web"
depends = ["web:relay"]
run = "pnpm exec vp test run"

[tasks."web:storybook"]
dir = "web"
depends = ["web:relay"]
run = "pnpm exec storybook build --quiet"

# E2E テスト。ビルド済みの SPA を vp preview で配信して確かめる。
# Chromium は pnpm exec playwright install chromium で入れるか、KOTATSU_E2E_CHROMIUM に手元のものを指定する。
[tasks."web:e2e"]
dir = "web"
depends = ["web:build"]
run = "pnpm exec playwright test --project=spa"

# 偽のチューナーサーバーと Kotatsu を立てて、初回セットアップ、ルール、ライブ視聴の流れを E2E で確かめる (#508)。
# KOTATSU_DATABASE_URL に、空の DB を渡す。
[tasks."e2e:stack"]
# 画面を埋め込むので、Kotatsu は web:build の後にビルドする。depends に並べると、同時に走ってしまう。
depends = ["web:build"]
run = ["go build -trimpath -o ./bin/ ./cmd/kotatsu", "scripts/e2e-stack.sh"]

# サーバーの goja で動かす zxcvbn-ts のバンドル (設計書 2.2) を作り、gzip で internal/password に置く。
[tasks."password:zxcvbn"]
dir = "web"
depends = ["web:install"]
run = [
  "pnpm exec vp build --config zxcvbn/vite.config.ts",
  "gzip -9nc zxcvbn/dist/zxcvbn.js > ../internal/password/zxcvbn.js.gz",
]

[tasks."web:dev"]
dir = "web"
depends = ["web:install"]
run = "pnpm exec vp dev"

[tasks.test]
# DB を使うテストは、パッケージをまたいで並行に動くと PostgreSQL の接続数の上限 (既定は 100) に達する。
# CPU の多いマシンでも CI (4 コア) と同じ並行度になるよう、同時に動かすパッケージの数を絞る。
run = "go test -race -p 4 ./..."

[tasks.lint]
run = "golangci-lint run"

[tasks.fmt]
run = "golangci-lint fmt"

# db/schema.sql とマイグレーションの差分から、新しいマイグレーションを生成する (Docker が要る)。
# 名前を付けるときは mise run db:diff -- add_users のように渡す。
[tasks."db:diff"]
run = "atlas migrate diff --env local"

[tasks.generate]
depends = ["password:zxcvbn"]
run = [
  "sqlc generate",
  # GraphQL のスキーマから、実行のコードとモデルを生成する。リゾルバの実装は残る。
  "go tool gqlgen generate",
  # gqlgen が書き換えたリゾルバの import を、リポジトリの形式にそろえる。
  "golangci-lint fmt",
  # フロントエンドの Relay のコンパイラが読む、1 つにまとめたスキーマを書き出す。
  "go run ./graph/printschema > web/schema.graphql",
  # 囲み文字の表 (internal/epg/enclosed.go) を、画面で使う TypeScript に書き出す。
  "go run ./internal/epg/printenclosed > web/src/futon/enclosedCharacters.gen.ts",
  # schema.sql とマイグレーションが食い違っていれば、ここで新しいマイグレーションが生成される。
  "atlas migrate diff --env local",
  "atlas migrate validate --env local",
]
