[tools]
golangci-lint = "2.14.0" # go より先に置かないと、go/bin/ のバイナリが優先されてしまう
go = "1.27.1"
atlas-community = "1.3.0"
sqlc = "1.31.1"

[tasks.build]
run = "go build -trimpath -o ./bin/ ./cmd/kotatsu"

[tasks.test]
run = "go test -race ./..."

[tasks.lint]
run = "golangci-lint run"

[tasks.fmt]
run = "golangci-lint fmt"

# db/schema.sql とマイグレーションの差分から、新しいマイグレーションを生成する (Docker が要る)。
# 名前を付けるときは mise run db:diff -- add_users のように渡す。
[tasks."db:diff"]
run = "atlas migrate diff --env local"

[tasks.generate]
run = [
  "sqlc generate",
  # schema.sql とマイグレーションが食い違っていれば、ここで新しいマイグレーションが生成される。
  "atlas migrate diff --env local",
  "atlas migrate validate --env local",
]
